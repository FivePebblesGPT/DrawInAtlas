name: Godot T-264 dock lost-mouse-up recovery (on demand)

on:
  workflow_dispatch:

jobs:
  dock-release-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install pinned Godot 4.8 beta 3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta4
          use-dotnet: false
      - name: Install pinned Rust 1.99.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Install X11/Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Build native extension and import both consumers
        run: make build TOOLCHAIN=system
      - name: Test standalone expanded, minimized and flyout dock recovery
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a --server-args='-screen 0 2200x1500x24' godot \
            --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy \
            --path drawing --script res://tests/t264_dock_lost_release_native.gd 2>&1 | tee /tmp/t264-native.log
          python3 tools/check_godot_model_log.py /tmp/t264-native.log --marker T264_NATIVE_PASSED
      - name: Test Atlas embedded dock recovery
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a --server-args='-screen 0 2200x1500x24' godot \
            --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/t264_atlas_dock_lost_release_native.gd 2>&1 | tee /tmp/t264-atlas.log
          python3 tools/check_godot_model_log.py /tmp/t264-atlas.log --marker T264_ATLAS_PASSED
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t264-docked-lost-release
          path: |
            /tmp/t264-native.log
            /tmp/t264-atlas.log
          if-no-files-found: warn
