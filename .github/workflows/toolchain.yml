name: T-180 Rebuildable Linux native toolchain

on:
  pull_request:
    paths:
      - Makefile
      - toolchain.lock.toml
      - pyproject.toml
      - .github/workflows/toolchain.yml
      - tools/toolchain.py
      - tools/prepare_native_project.py
      - tools/build_native_brush.sh
      - tools/build_drawing_app.py
      - tools/check_offline_toolchain.py
      - native/drawing_brush/**
      - drawing/tests/native_extension_ready.gd
      - tests/test_toolchain_build.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install archive / software-rendering prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd bubblewrap xvfb libgl1 libgl1-mesa-dri libx11-6
      - name: Inspect prerequisites
        run: |
          python3 --version
          make --version | head -1
          rustup --version
      - name: Bootstrap unit tests
        run: make python-test
      - name: Recreate offline toolchain
        run: make bundle
      - name: Validate archive manifest
        run: make bundle-verify
      - name: Test native-present Drawing/Atlas with offline toolchain
        run: |
          python3 tools/check_offline_toolchain.py \
            --bundle .build/bundles/drawing-toolchain-linux-x86_64.tar.zst \
            --output /tmp/t180-cold-consumer
      - name: Keep raw cold-consumer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t180-cold-offline-logs
          path: |
            /tmp/t180-cold-consumer/*.log
            /tmp/t180-cold-consumer/results.json
            .build/bundles/*.sha256
      - name: Archive digest
        if: always()
        run: |
          if test -f .build/bundles/drawing-toolchain-linux-x86_64.tar.zst.sha256; then
            cat .build/bundles/drawing-toolchain-linux-x86_64.tar.zst.sha256 >> "$GITHUB_STEP_SUMMARY"
          fi
