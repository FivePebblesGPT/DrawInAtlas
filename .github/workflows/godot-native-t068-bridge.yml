name: Godot T-068 isolated raster GDExtension (on demand)

on:
  workflow_dispatch:

jobs:
  native-raster-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install pinned Godot 4.8 beta 2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta2
          use-dotnet: false
      - name: Install native framebuffer test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Verify host C++ toolchain and isolated-runner contracts
        run: |
          g++ --version
          python3 -m unittest discover -s tests -p test_t068_bridge_runner.py -v
          python3 -m unittest discover -s tests -p test_t068_scalar_gdextension.py -v
          python3 -m unittest discover -s tests -p test_t068_scalar_transform.py -v
      - name: Build and verify isolated native, texture, document, and scalar sparse brush paths
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 300s \
            python3 tools/benchmarks/t068_bridge/run_bridge.py \
              --godot "$(command -v godot)" --runs 2 \
              --output /tmp/t068-gdextension-bridge.json
          test -s /tmp/t068-gdextension-bridge.json
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t068-gdextension-isolated-evidence
          path: /tmp/t068-gdextension-bridge.json
          if-no-files-found: warn
