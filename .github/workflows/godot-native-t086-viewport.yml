name: Godot T-086 source-space viewport cache (on demand, software only)

on:
  workflow_dispatch:

jobs:
  viewport-cache-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1 # Archived pre-cache fixture works even after squashing commits.
      - name: Install pinned Godot 4.8 beta 3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta4
          use-dotnet: false
      - name: Install pinned Rust 1.99.1 and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Install software-display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Build required native extension and import Drawing/Atlas consumers
        run: |
          set -euo pipefail
          # Clean checkouts do not contain the Rust .so. Import after registering it.
          make build TOOLCHAIN=system
      - name: Verify held-button pixels, text, signed seams and dirty texture uploads
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s xvfb-run -a godot --display-driver x11 --rendering-method gl_compatibility \
            --audio-driver Dummy --path drawing --script res://tests/viewport_cache_native.gd \
            2>&1 | tee /tmp/t086-native.log
          python3 tools/check_t086_logs.py viewport /tmp/t086-native.log
      - name: T-102 validate bounded cold occupancy scheduling headlessly
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing \
            --script res://tests/t102_cold_population_smoke.gd \
            2>&1 | tee /tmp/t102-cold-model.log
          python3 tools/check_godot_model_log.py /tmp/t102-cold-model.log --marker T102_MODEL_PASSED
      - name: T-102 cold dense 25/50/100 framebuffer, settlement and history
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 240s xvfb-run -a godot --display-driver x11 \
            --rendering-method gl_compatibility --audio-driver Dummy --path drawing \
            --script res://tests/t102_cold_dense_viewport_native.gd \
            2>&1 | tee /tmp/t102-cold-native.log
          grep -Fxq 'T102_NATIVE: 110 checks; 0 failed' /tmp/t102-cold-native.log
          python3 tools/check_godot_model_log.py /tmp/t102-cold-native.log --marker T102_NATIVE_PASSED
      - name: T-103 large dense over-budget wheel, pan, masks, history and Save
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing \
            --script res://tests/t103_retention_plan_smoke.gd \
            2>&1 | tee /tmp/t103-retention.log
          python3 tools/check_godot_model_log.py /tmp/t103-retention.log --marker T103_MODEL_PASSED
          timeout --signal=TERM --kill-after=5s 300s xvfb-run -a godot --display-driver x11 \
            --rendering-method gl_compatibility --audio-driver Dummy --path drawing \
            --script res://tests/t103_overbudget_viewport_native.gd \
            2>&1 | tee /tmp/t103-overbudget-native.log
          grep -Fxq 'T103_NATIVE: 150 checks; 0 failed' /tmp/t103-overbudget-native.log
          python3 tools/check_godot_model_log.py /tmp/t103-overbudget-native.log --marker T103_NATIVE_PASSED
      - name: T-135 sparse wide viewport traversal and native framebuffer
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s xvfb-run -a godot --display-driver x11 \
            --rendering-method gl_compatibility --audio-driver Dummy --path drawing \
            --script res://tests/t135_sparse_draw_native.gd \
            2>&1 | tee /tmp/t135-sparse-native.log
          grep -Fxq 'T135_NATIVE_PASSED checks=23 failures=0' /tmp/t135-sparse-native.log
          python3 tools/check_godot_model_log.py /tmp/t135-sparse-native.log --marker T135_NATIVE_PASSED
      - name: T-136 detached sparse preview union and framebuffer
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s xvfb-run -a godot --display-driver x11 \
            --rendering-method gl_compatibility --audio-driver Dummy --path drawing \
            --script res://tests/t136_preview_sparse_union_native.gd \
            2>&1 | tee /tmp/t136-preview-sparse-native.log
          grep -Fxq 'T136_NATIVE_PASSED checks=26 failures=0' /tmp/t136-preview-sparse-native.log
          python3 tools/check_godot_model_log.py /tmp/t136-preview-sparse-native.log --marker T136_NATIVE_PASSED
      - name: T-137 bounded detached-preview cold population and framebuffer
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s xvfb-run -a godot --display-driver x11 \
            --rendering-method gl_compatibility --audio-driver Dummy --path drawing \
            --script res://tests/t137_preview_cold_population_native.gd \
            2>&1 | tee /tmp/t137-preview-cold-native.log
          grep -Fxq 'T137_NATIVE_PASSED checks=19 failures=0' /tmp/t137-preview-cold-native.log
          python3 tools/check_godot_model_log.py /tmp/t137-preview-cold-native.log --marker T137_NATIVE_PASSED
      - name: T-138 over-budget detached preview focal retention and framebuffer
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s xvfb-run -a godot --display-driver x11 \
            --rendering-method gl_compatibility --audio-driver Dummy --path drawing \
            --script res://tests/t138_preview_focal_plan_native.gd \
            2>&1 | tee /tmp/t138-preview-focal-native.log
          grep -Fxq 'T138_NATIVE_PASSED checks=22 failures=0' /tmp/t138-preview-focal-native.log
          python3 tools/check_godot_model_log.py /tmp/t138-preview-focal-native.log --marker T138_NATIVE_PASSED
      - name: Compare pre-cache and cached software frame timings
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 440s python3 tools/benchmarks/t086_compare_viewport.py \
            --godot godot 2>&1 | tee /tmp/t086-comparison.log
          python3 tools/check_godot_model_log.py /tmp/t086-comparison.log --marker T086_COMPARISON_PASSED
      # The two SHA-pinned old cold renderer fixtures no longer compile with
      # DrawingRenderer.prepare_visible_layers/render(..., visible_plan). Keep
      # them immutable for provenance, but gate the required-native workflow
      # on the current renderer's deterministic RGBA8 and CPU timing witness.
      - name: Validate immutable archived cold renderer fixtures
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_t086_benchmark_fixtures -v 2>&1 | tee /tmp/t086-cold-fixtures.log
      - name: Verify current native cold-composition RGBA8 and timing
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s godot --headless --audio-driver Dummy \
            --path drawing --script res://tests/renderer_cold_benchmark.gd \
            2>&1 | tee /tmp/t086-current-cold.log
          python3 tools/check_t086_logs.py cold /tmp/t086-current-cold.log
      - name: Upload native software-only diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t086-xvfb-display-cache-and-compare
          path: |
            /tmp/t086-native.log
            /tmp/t102-cold-model.log
            /tmp/t102-cold-native.log
            /tmp/t103-retention.log
            /tmp/t103-overbudget-native.log
            /tmp/t135-sparse-native.log
            /tmp/t136-preview-sparse-native.log
            /tmp/t138-preview-focal-native.log
            /tmp/t137-preview-cold-native.log
            /tmp/t086-comparison.log
            /tmp/t086-cold-fixtures.log
            /tmp/t086-current-cold.log
          if-no-files-found: warn
