name: Godot T-086 source-space viewport cache (on demand, software only)

on:
  workflow_dispatch:

jobs:
  viewport-cache-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1 # Archived pre-cache fixture works even after squashing commits.
      - name: Install pinned Godot 4.8 beta 2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta2
          use-dotnet: false
      - name: Install software-display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Stage and import independent Drawing package
        run: |
          set -euo pipefail
          python3 tools/build_drawing_app.py --in-place
          timeout --signal=TERM --kill-after=5s 240s godot --headless --editor --path drawing --import --quit
      - name: Verify held-button pixels, text, signed seams and dirty texture uploads
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s xvfb-run -a godot --display-driver x11 --rendering-method gl_compatibility \
            --audio-driver Dummy --path drawing --script res://tests/viewport_cache_native.gd \
            2>&1 | tee /tmp/t086-native.log
          grep -Fxq 'T086_NATIVE: 140 checks; 0 failed' /tmp/t086-native.log
          python3 tools/check_godot_model_log.py /tmp/t086-native.log --marker T086_NATIVE_PASSED
      - name: Compare pre-cache and cached software frame timings
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 440s python3 tools/benchmarks/t086_compare_viewport.py \
            --godot godot 2>&1 | tee /tmp/t086-comparison.log
          grep -q 'T086_COMPARISON_PASSED' /tmp/t086-comparison.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|Traceback|FAILED:' /tmp/t086-comparison.log; then exit 1; fi
      - name: Compare pinned pre-optimization and bounded cold CPU composite timings
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 330s python3 tools/benchmarks/t086_compare_cold_composite.py \
            --godot godot 2>&1 | tee /tmp/t086-cold-comparison.log
          grep -q 'T086_COLD_COMPARISON_PASSED' /tmp/t086-cold-comparison.log
          if grep -E 'SCRIPT ERROR:|Traceback|T086_COLD_BENCH_FAILED:' /tmp/t086-cold-comparison.log; then exit 1; fi
          timeout --signal=TERM --kill-after=5s 330s python3 tools/benchmarks/t086_compare_cold_composite.py \
            --godot godot --baseline pre-indexed-read 2>&1 | tee /tmp/t086-direct-sparse-comparison.log
          grep -q 'T086_COLD_COMPARISON_PASSED' /tmp/t086-direct-sparse-comparison.log
          if grep -E 'SCRIPT ERROR:|Traceback|T086_COLD_BENCH_FAILED:' /tmp/t086-direct-sparse-comparison.log; then exit 1; fi
      - name: Upload native software-only diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t086-xvfb-display-cache-and-compare
          path: |
            /tmp/t086-native.log
            /tmp/t086-comparison.log
            /tmp/t086-cold-comparison.log
            /tmp/t086-direct-sparse-comparison.log
          if-no-files-found: warn
