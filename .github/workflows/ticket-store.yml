name: Ticket store validation
on:
  pull_request:
    paths:
      - 'docs/Tickets/**'
      - 'docs/Index.md'
      - 'docs/TICKET_WORKFLOW.md'
      - 'tools/validate_ticket_store.py'
  push:
    branches: [aidev]
    paths:
      - 'docs/Tickets/**'
      - 'docs/Index.md'
      - 'docs/TICKET_WORKFLOW.md'
      - 'tools/validate_ticket_store.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ticket statuses and manual-review gates
        run: python3 tools/validate_ticket_store.py
