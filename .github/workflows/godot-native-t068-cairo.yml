name: T-068 optional Cairo CPU parity screen (on demand)

on:
  workflow_dispatch:

jobs:
  cairo-cpu-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install optional CPU comparator runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcairo2 g++
      - name: Verify oracle, native bounds, and Cairo format contracts
        run: python3 -m unittest discover -s tests -p test_t068_cairo_cpu.py -v
      - name: Capture two reproducible source-over and RGBA8 discrepancy screens
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/benchmarks/t068_cairo_cpu.py --runs 2 --trials 9 \
            --output /tmp/t068-cairo-cpu.json | tee /tmp/t068-cairo-cpu.log
          grep -q 'T068_CAIRO_CPU_PASSED: 36 verified cases across 2 runs;' /tmp/t068-cairo-cpu.log
          test -s /tmp/t068-cairo-cpu.json
      - name: Upload parity and timing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t068-cairo-cpu-diagnostics
          path: |
            /tmp/t068-cairo-cpu.json
            /tmp/t068-cairo-cpu.log
          if-no-files-found: warn
