name: Godot T-080 native tab/group reorder and clipped-dock boundary (on demand)

on:
  workflow_dispatch:

jobs:
  dock-reorder-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install pinned Godot 4.8 beta 2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta2
          use-dotnet: false
      - name: Install X11 software rendering
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Verify native-log and boundary test contracts
        run: python3 -m unittest discover -s tests -p 'test_t080_dock_native.py' -v
      - name: Stage canonical standalone Drawing app and import SVGs
        run: |
          set -euo pipefail
          python3 tools/build_drawing_app.py --in-place
          timeout --signal=TERM --kill-after=5s 240s godot --headless --editor --path drawing --import --quit
      - name: Verify pointer/keyboard, invalid targets and bottom dock insertion
        run: |
          set -euo pipefail
          mkdir -p /tmp/t080-screenshots
          T080_SCREENSHOTS=/tmp/t080-screenshots timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a --server-args='-screen 0 2200x1500x24' godot --display-driver x11 \
            --rendering-method gl_compatibility --audio-driver Dummy --path drawing \
            --script res://tests/dock_reorder_native.gd 2>&1 | tee /tmp/t080-native.log
          python3 tools/check_native_t080_log.py /tmp/t080-native.log
      - name: Upload real framebuffer and original native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t080-x11-dock-reorder
          path: |
            /tmp/t080-native.log
            /tmp/t080-screenshots/
          if-no-files-found: warn
