name: Godot T-261 interrupted color picker recovery (on demand)

on:
  workflow_dispatch:

jobs:
  color-interruption-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install pinned Godot 4.8 beta 3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta4
          use-dotnet: false
      - name: Install pinned Rust 1.99.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Install X11/Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Build extension and import Drawing + Atlas
        run: make build TOOLCHAIN=system
      - name: Test standalone interrupted ColorPicker
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a --server-args='-screen 0 2200x1400x24' godot \
            --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy \
            --path drawing --script res://tests/t261_color_interruption_native.gd 2>&1 | tee /tmp/t261-native.log
          python3 tools/check_godot_model_log.py /tmp/t261-native.log --marker T261_NATIVE_PASSED
      - name: Test Atlas-hosted interrupted ColorPicker
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a --server-args='-screen 0 2200x1400x24' godot \
            --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/t261_atlas_color_interruption_native.gd 2>&1 | tee /tmp/t261-atlas.log
          python3 tools/check_godot_model_log.py /tmp/t261-atlas.log --marker T261_ATLAS_PASSED
      - name: Upload evidence logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t261-color-interruption
          path: |
            /tmp/t261-native.log
            /tmp/t261-atlas.log
          if-no-files-found: warn
