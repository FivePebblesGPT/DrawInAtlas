name: Godot T-089 layer hierarchy native witness (on demand, software only)

on:
  workflow_dispatch:

jobs:
  layers-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install pinned Godot 4.8 beta 2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta2
          use-dotnet: false
      - name: Install software-display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Stage and import canonical standalone Drawing package
        run: |
          set -euo pipefail
          python3 tools/build_drawing_app.py --in-place
          timeout --signal=TERM --kill-after=5s 240s godot --headless --editor --path drawing --import --quit
      - name: Verify X11 dock wheel, row eye/lock pointer, keyboard and framebuffer
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s xvfb-run -a godot --display-driver x11 --rendering-method gl_compatibility \
            --audio-driver Dummy --path drawing --script res://tests/layer_structure_native.gd \
            2>&1 | tee /tmp/t089-native.log
          python3 tools/check_native_t089_log.py /tmp/t089-native.log
      - name: Upload software-only diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t089-xvfb-layer-structure
          path: /tmp/t089-native.log
          if-no-files-found: warn
