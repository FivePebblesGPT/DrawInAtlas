name: Godot T-068 native fill-to-frame (on demand)

on:
  workflow_dispatch:

jobs:
  native-fill-frame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install pinned Godot 4.8 beta 2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta2
          use-dotnet: false
      - name: Install software-display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Import main project
        run: timeout --signal=TERM --kill-after=5s 240s godot --headless --editor --path . --import --quit
      - name: Verify native fill-to-frame, capture diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t068-native-fill
          timeout --signal=TERM --kill-after=5s 240s xvfb-run -a -s '-screen 0 1280x900x24' \
            godot --audio-driver Dummy --rendering-driver opengl3 \
            --rendering-method gl_compatibility --path . \
            --script res://tests/drawing_fill_frame_native.gd -- \
            --output /tmp/t068-native-fill/measurements.json \
            --screenshot /tmp/t068-native-fill/framebuffer.png \
            2>&1 | tee /tmp/t068-native-fill/run.log
          grep -q 'T068_FILL_FRAME_PASSED' /tmp/t068-native-fill/run.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T068_FILL_FRAME_FAILED:' /tmp/t068-native-fill/run.log; then exit 1; fi
          test -s /tmp/t068-native-fill/measurements.json
          test -s /tmp/t068-native-fill/framebuffer.png
      - name: Upload measured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t068-native-fill-evidence
          path: /tmp/t068-native-fill/
          if-no-files-found: warn
