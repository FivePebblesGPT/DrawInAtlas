name: Godot T-068 native fill-to-frame (on demand)

on:
  workflow_dispatch:

jobs:
  native-fill-frame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install pinned Godot 4.8 beta 2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta2
          use-dotnet: false
      - name: Install software-display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Import main project
        run: timeout --signal=TERM --kill-after=5s 240s godot --headless --editor --path . --import --quit
      - name: Verify native fill-to-frame, capture process RSS and jitter
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_t068_fill_process_profile.py
          timeout --signal=TERM --kill-after=5s 400s python3 \
            tools/benchmarks/t068_fill_process_profile.py \
            --godot "$(command -v godot)" \
            --output-dir /tmp/t068-native-fill --runs 2 --trials 21 \
            --sample-ms 10 --timeout-seconds 180
          test -s /tmp/t068-native-fill/evidence.json
          test -s /tmp/t068-native-fill/run_1.png
          test -s /tmp/t068-native-fill/run_2.png
      - name: Upload measured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t068-native-fill-evidence
          path: /tmp/t068-native-fill/
          if-no-files-found: warn
