name: Godot T-256 floating icon context menus (on demand)

on:
  workflow_dispatch:

jobs:
  floating-context-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install pinned Godot 4.8 beta 3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta4
          use-dotnet: false
      - name: Install pinned Rust 1.99.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Install software X11 display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Build required native library and import both consumers
        run: |
          set -euo pipefail
          make build TOOLCHAIN=system
      - name: Test RMB, Shift+F10, clipping, split, redock and UI scale
        run: |
          set -euo pipefail
          mkdir -p /tmp/t256-screenshots
          T256_SCREENSHOTS=/tmp/t256-screenshots timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a --server-args='-screen 0 2200x1500x24' godot --display-driver x11 \
            --rendering-method gl_compatibility --audio-driver Dummy --path drawing \
            --script res://tests/t256_floating_tab_menu_native.gd 2>&1 | tee /tmp/t256-native.log
          python3 tools/check_godot_model_log.py /tmp/t256-native.log --marker T256_NATIVE_PASSED
      - name: Test canonical Atlas-embedded floating context
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a --server-args='-screen 0 2200x1500x24' godot --display-driver x11 \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script res://tests/t256_atlas_floating_tab_menu_native.gd 2>&1 | tee /tmp/t256-atlas.log
          python3 tools/check_godot_model_log.py /tmp/t256-atlas.log --marker T256_ATLAS_PASSED
      - name: Upload original logs and framebuffer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t256-native-floating-context
          path: |
            /tmp/t256-native.log
            /tmp/t256-atlas.log
            /tmp/t256-screenshots/
          if-no-files-found: warn
