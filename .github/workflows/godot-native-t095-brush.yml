name: Godot T-095 60px Brush profile and independent oracle (on demand, software only)

on:
  workflow_dispatch:

jobs:
  brush-profile-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install pinned Godot 4.8 beta 3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta3
          use-dotnet: false
      - name: Install software-display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Stage and import from canonical Drawing source
        run: |
          set -euo pipefail
          python3 tools/build_drawing_app.py --in-place
          timeout --signal=TERM --kill-after=5s 240s godot --headless --editor --path drawing --import --quit
      - name: Exact 60px Brush/Eraser source oracle and transaction rollback
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/brush_coverage_smoke.gd 2>&1 | tee /tmp/t095-oracle.log
          python3 tools/check_godot_model_log.py /tmp/t095-oracle.log --marker T095_ORACLE_PASSED
      - name: T-095 duplicate stationary hard-brush waypoint/source-history oracle
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_duplicate_waypoints_smoke.gd \
            2>&1 | tee /tmp/t095-duplicate-waypoints.log
          python3 tools/check_godot_model_log.py /tmp/t095-duplicate-waypoints.log \
            --marker T095_DUPLICATE_WAYPOINT_PASSED
      - name: T-095 cross-batch stationary Legacy dab source/history and retry oracle
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_cross_batch_dab_smoke.gd \
            2>&1 | tee /tmp/t095-cross-batch-dab.log
          python3 tools/check_godot_model_log.py /tmp/t095-cross-batch-dab.log \
            --marker T095_CROSS_BATCH_DAB_PASSED
      - name: T-095 bounded Legacy duplicate-target drain and exact input accounting
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_duplicate_drain_batch_smoke.gd \
            2>&1 | tee /tmp/t095-duplicate-drain.log
          python3 tools/check_godot_model_log.py /tmp/t095-duplicate-drain.log \
            --marker T095_DUPLICATE_DRAIN_PASSED
      - name: T-095 suppress unchanged-preview redraws across delivered input frames
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_noop_redraw_smoke.gd \
            2>&1 | tee /tmp/t095-noop-redraw.log
          python3 tools/check_godot_model_log.py /tmp/t095-noop-redraw.log \
            --marker T095_NOOP_REDRAW_PASSED
      - name: T-095 reuse unchanged Canvas preview projection across cursor frames
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_preview_index_reuse_smoke.gd \
            2>&1 | tee /tmp/t095-preview-index-reuse.log
          python3 tools/check_godot_model_log.py /tmp/t095-preview-index-reuse.log \
            --marker T095_PREVIEW_REUSE_PASSED
      - name: T-098 exact changed display-tile preview and fallback regression
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a -s '-screen 0 1280x900x24' \
            godot --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy \
            --path drawing --script res://tests/t098_preview_display_cache_smoke.gd \
            2>&1 | tee /tmp/t098-preview-display.log
          python3 tools/check_godot_model_log.py /tmp/t098-preview-display.log \
            --marker T098_PREVIEW_DISPLAY_PASSED
      - name: T-100 sparse atomic tile publication and canonical Undo/Redo oracle
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s godot --headless --audio-driver Dummy \
            --path drawing --script res://tests/t100_sparse_publication_smoke.gd \
            2>&1 | tee /tmp/t100-sparse-publication.log
          python3 tools/check_godot_model_log.py /tmp/t100-sparse-publication.log \
            --marker T100_SPARSE_PUBLICATION_PASSED
      - name: T-101 NativeHard tile-dispatch bypass, mixed transaction and retry oracle
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s godot --headless --audio-driver Dummy \
            --path drawing --script res://tests/t101_native_hard_dispatch_smoke.gd \
            2>&1 | tee /tmp/t101-native-dispatch.log
          python3 tools/check_godot_model_log.py /tmp/t101-native-dispatch.log \
            --marker T101_NATIVE_DISPATCH_PASSED
      - name: T-095 internal Brush success-result ownership and history
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_brush_result_reuse_smoke.gd 2>&1 | tee /tmp/t095-brush-result.log
          python3 tools/check_godot_model_log.py /tmp/t095-brush-result.log --marker T095_BRUSH_RESULT_PASSED
      - name: T-095 original oblique Geometry2D Brush/Eraser parity
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_oblique_geometry_smoke.gd 2>&1 | tee /tmp/t095-oblique.log
          python3 tools/check_godot_model_log.py /tmp/t095-oblique.log --marker T095_OBLIQUE_GEOMETRY_PASSED
      - name: T-095 stationary and axis-aligned Brush scanline bounds vs Geometry2D
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_axis_scanline_bounds_smoke.gd \
            2>&1 | tee /tmp/t095-axis-scanline.log
          python3 tools/check_godot_model_log.py /tmp/t095-axis-scanline.log \
            --marker T095_AXIS_SCANLINE_PASSED
      - name: T-095 conservative oblique Brush scanlines vs full Geometry2D
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_oblique_scanline_bounds_smoke.gd \
            2>&1 | tee /tmp/t095-oblique-scanlines.log
          python3 tools/check_godot_model_log.py /tmp/t095-oblique-scanlines.log \
            --marker T095_OBLIQUE_SCANLINE_PASSED
      - name: T-095 sustained input queue compaction and full-path parity
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_input_queue_compaction_smoke.gd 2>&1 | tee /tmp/t095-queue-compaction.log
          python3 tools/check_godot_model_log.py /tmp/t095-queue-compaction.log --marker T095_QUEUE_COMPACTION_PASSED
      - name: T-095 bounded sample-age metrics and long Brush parity
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_latency_window_smoke.gd 2>&1 | tee /tmp/t095-latency-window.log
          python3 tools/check_godot_model_log.py /tmp/t095-latency-window.log --marker T095_LATENCY_WINDOW_PASSED
      - name: T-095 bounded latest stage-batch timing and Brush history parity
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_stage_batch_window_smoke.gd 2>&1 | tee /tmp/t095-stage-batch-window.log
          python3 tools/check_godot_model_log.py /tmp/t095-stage-batch-window.log --marker T095_STAGE_BATCH_WINDOW_PASSED
      - name: T-095 bounded render-frame phase timing, pixels and history
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_frame_phase_window_smoke.gd 2>&1 | tee /tmp/t095-frame-phase.log
          python3 tools/check_godot_model_log.py /tmp/t095-frame-phase.log \
            --marker T095_FRAME_PHASE_PASSED
      - name: T-095 frame-aligned pending input age, queue depth and Brush parity
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_frame_input_backlog_smoke.gd 2>&1 | tee /tmp/t095-frame-backlog.log
          python3 tools/check_godot_model_log.py /tmp/t095-frame-backlog.log \
            --marker T095_FRAME_BACKLOG_PASSED
      - name: T-095 correlate latest Canvas draw with Godot post-draw callback
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_frame_post_draw_pairing_smoke.gd \
            2>&1 | tee /tmp/t095-postdraw-pairing.log
          python3 tools/check_godot_model_log.py /tmp/t095-postdraw-pairing.log \
            --marker T095_POSTDRAW_PAIR_PASSED
      - name: T-095 correlate changed Brush preview stage with Canvas and callback
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_preview_stage_postdraw_smoke.gd \
            2>&1 | tee /tmp/t095-preview-stage-postdraw.log
          python3 tools/check_godot_model_log.py /tmp/t095-preview-stage-postdraw.log \
            --marker T095_PREVIEW_STAGE_POSTDRAW_PASSED
      - name: T-095 correlate input receipt with changed Brush Canvas callback
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_preview_input_postdraw_smoke.gd \
            2>&1 | tee /tmp/t095-preview-input-postdraw.log
          python3 tools/check_godot_model_log.py /tmp/t095-preview-input-postdraw.log \
            --marker T095_PREVIEW_INPUT_POSTDRAW_PASSED
      - name: T-095 trace analyzer anonymous runtime cohorts and frame-clock consistency
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_t095_trace_analyzer.py -v \
            2>&1 | tee /tmp/t095-trace-analyzer.log
          echo "T095_TRACE_ANALYZER_PASSED" | tee -a /tmp/t095-trace-analyzer.log
          python3 tools/check_godot_model_log.py /tmp/t095-trace-analyzer.log \
            --marker T095_TRACE_ANALYZER_PASSED
      - name: T-095 opt-in bounded owner-device Brush timing trace
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_owner_trace_smoke.gd \
            2>&1 | tee /tmp/t095-owner-trace.log
          python3 tools/check_godot_model_log.py /tmp/t095-owner-trace.log \
            --marker T095_OWNER_TRACE_PASSED
      - name: T-095 Brush tile-key reuse and signed source/history parity
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_brush_tile_key_cache_smoke.gd \
            2>&1 | tee /tmp/t095-brush-tile-key-cache.log
          python3 tools/check_godot_model_log.py /tmp/t095-brush-tile-key-cache.log \
            --marker T095_BRUSH_TILE_KEY_CACHE_PASSED
      - name: T-095 cached Brush source/preview references and failure retry
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_brush_tile_reference_cache_smoke.gd \
            2>&1 | tee /tmp/t095-brush-tile-reference.log
          python3 tools/check_godot_model_log.py /tmp/t095-brush-tile-reference.log \
            --marker T095_BRUSH_TILE_REFERENCE_PASSED
      - name: T-095 signed Legacy tile/source lookup and history parity
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_stage_tile_lookup_smoke.gd 2>&1 | tee /tmp/t095-stage-lookup.log
          python3 tools/check_godot_model_log.py /tmp/t095-stage-lookup.log --marker T095_STAGE_LOOKUP_PASSED
      - name: T-095 original source-over RGBA8 blend parity (all alpha pairs)
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/brush_blend_math_smoke.gd 2>&1 | tee /tmp/t095-blend.log
          python3 tools/check_godot_model_log.py /tmp/t095-blend.log --marker T095_BLEND_PASSED
      - name: Hokusai batch-delta source/preview parity (native binary not required)
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/hokusai_bulk_delta_smoke.gd 2>&1 | tee /tmp/t095-hokusai-delta.log
          python3 tools/check_godot_model_log.py /tmp/t095-hokusai-delta.log --marker T095_BULK_DELTA_PASSED
      - name: T-095 signed native tile arithmetic and original-pixel parity
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_tile_shift_smoke.gd 2>&1 | tee /tmp/t095-tile-shift.log
          python3 tools/check_godot_model_log.py /tmp/t095-tile-shift.log --marker T095_TILE_SHIFT_PASSED
      - name: T-095 Legacy Brush-only tile-commit and history parity
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_legacy_tile_commit_smoke.gd 2>&1 | tee /tmp/t095-legacy-tile-commit.log
          python3 tools/check_godot_model_log.py /tmp/t095-legacy-tile-commit.log --marker T095_LEGACY_TILE_COMMIT_PASSED
      - name: T-095 deferred Legacy Brush tile-local staging and mixed-edit parity
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_brush_deferred_staging_smoke.gd 2>&1 | tee /tmp/t095-brush-deferred.log
          python3 tools/check_godot_model_log.py /tmp/t095-brush-deferred.log --marker T095_BRUSH_DEFERRED_PASSED
      - name: T-095 failed mixed edit preserves deferred Brush and retry history
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_mixed_edit_rollback_smoke.gd 2>&1 | tee /tmp/t095-mixed-rollback.log
          python3 tools/check_godot_model_log.py /tmp/t095-mixed-rollback.log --marker T095_MIXED_ROLLBACK_PASSED
      - name: T-095 native tile-commit and history parity (native binary not required)
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_tile_commit_smoke.gd 2>&1 | tee /tmp/t095-tile-commit.log
          python3 tools/check_godot_model_log.py /tmp/t095-tile-commit.log --marker T095_TILE_COMMIT_PASSED
      - name: T-095 independent sparse detached-preview compositor oracle
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/t095_sparse_preview_smoke.gd 2>&1 | tee /tmp/t095-sparse-preview.log
          python3 tools/check_godot_model_log.py /tmp/t095-sparse-preview.log --marker T095_SPARSE_PREVIEW_PASSED
      # Opt-in native checks are separate from the required fast GDScript CI.
      # Build at the pinned Rust crate versions; do not commit this binary.
      - name: Select Rust for optional NativeHard GDExtension
        uses: dtolnay/rust-toolchain@stable
      - name: Build and preimport optional native brush
        run: |
          set -euo pipefail
          cargo build --manifest-path native/drawing_brush/Cargo.toml --locked --release
          mkdir -p addons/drawing/native/bin
          cp native/drawing_brush/target/release/libdrawing_brush.so \
            addons/drawing/native/bin/libdrawing_brush.so
          cp native/drawing_brush/drawing_brush.gdextension.template \
            addons/drawing/native/drawing_brush.gdextension
          python3 tools/build_drawing_app.py --in-place
          # Pin the extension in Godot's initial registry before editor import;
          # registering after cold editor startup is unsafe on the beta runtime.
          mkdir -p drawing/.godot
          printf 'res://addons/drawing/native/drawing_brush.gdextension\n' \
            > drawing/.godot/extension_list.cfg
          timeout --signal=TERM --kill-after=5s 240s \
            godot --headless --editor --path drawing --import --quit
      - name: T-095 NativeHard whole-batch preflight and retry atomicity
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy \
            --path drawing --script res://tests/t095_native_hard_atomic.gd \
            2>&1 | tee /tmp/t095-native-hard-atomic.log
          python3 tools/check_godot_model_log.py /tmp/t095-native-hard-atomic.log \
            --marker T095_NATIVE_HARD_ATOMIC_PASSED
      - name: T-095 NativeHard conservative scanlines vs original full rectangles
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy \
            --path drawing --script res://tests/t095_native_hard_scanline_smoke.gd \
            2>&1 | tee /tmp/t095-native-hard-scanline.log
          python3 tools/check_godot_model_log.py /tmp/t095-native-hard-scanline.log \
            --marker T095_NATIVE_HARD_SCANLINE_PASSED
      - name: T-095 NativeHard packed output transfer and rollback parity
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy \
            --path drawing --script res://tests/t095_native_hard_packed_output.gd \
            2>&1 | tee /tmp/t095-native-hard-packed-output.log
          python3 tools/check_godot_model_log.py /tmp/t095-native-hard-packed-output.log \
            --marker T095_NATIVE_HARD_PACKED_OUTPUT_PASSED
      - name: T-095 real NativeHard rollback across failed GDScript source reads
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy \
            --path drawing --script res://tests/t095_native_hard_source_atomic.gd \
            2>&1 | tee /tmp/t095-native-hard-source-atomic.log
          python3 tools/check_godot_model_log.py /tmp/t095-native-hard-source-atomic.log \
            --marker T095_NATIVE_HARD_SOURCE_ATOMIC_PASSED
      - name: T-095 Hokusai packed pigment output bytes and transaction parity
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy \
            --path drawing --script res://tests/t095_native_preset_packed_output.gd \
            2>&1 | tee /tmp/t095-native-preset-packed-output.log
          python3 tools/check_godot_model_log.py /tmp/t095-native-preset-packed-output.log \
            --marker T095_NATIVE_PRESET_PACKED_PASSED
      - name: T-095 real Hokusai pigment rollback across failed GDScript source reads
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy \
            --path drawing --script res://tests/t095_native_pigment_atomic.gd \
            2>&1 | tee /tmp/t095-native-pigment-atomic.log
          python3 tools/check_godot_model_log.py /tmp/t095-native-pigment-atomic.log \
            --marker T095_NATIVE_PIGMENT_ATOMIC_PASSED
      - name: T-095 rapid 96px red Brush across 512x512 through real pointer routing
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s xvfb-run -a -s '-screen 0 1280x900x24' \
            env T099_MAX_PREVIEW_FRAMES=110 godot --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy \
            --path drawing --script res://tests/t095_full_canvas_brush_native.gd \
            2>&1 | tee /tmp/t095-full-canvas.log
          python3 tools/check_godot_model_log.py /tmp/t095-full-canvas.log \
            --marker T095_FULL_CANVAS_PASSED
          # No synthetic-speed pass/fail threshold: the test reports whether the
          # proposed 100ms target is met, but only owner reference hardware can
          # apply the opt-in T095_FULL_CANVAS_P95_BUDGET_MS ceiling.
      - name: T-099 held preview, signed masked Brush/Eraser and navigation parity
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s xvfb-run -a -s '-screen 0 1280x900x24' \
            godot --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy \
            --path drawing --script res://tests/t099_preview_schedule_native.gd \
            2>&1 | tee /tmp/t099-preview-schedule.log
          python3 tools/check_godot_model_log.py /tmp/t099-preview-schedule.log \
            --marker T099_PREVIEW_SCHEDULE_PASSED
      - name: Real mouse routing and held-button software framebuffer profile
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s xvfb-run -a -s '-screen 0 1280x900x24' \
            godot --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy \
            --path drawing --script res://tests/brush_latency_native.gd \
            2>&1 | tee /tmp/t095-native.log
          python3 tools/check_godot_model_log.py /tmp/t095-native.log --marker T095_NATIVE_PASSED
      - name: Upload timing data (not owner GPU acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t095-independent-source-and-software-frames
          path: |
            /tmp/t095-oracle.log
            /tmp/t095-noop-redraw.log
            /tmp/t095-duplicate-waypoints.log
            /tmp/t095-cross-batch-dab.log
            /tmp/t095-duplicate-drain.log
            /tmp/t095-preview-index-reuse.log
            /tmp/t098-preview-display.log
            /tmp/t100-sparse-publication.log
            /tmp/t101-native-dispatch.log
            /tmp/t095-brush-deferred.log
            /tmp/t095-brush-tile-reference.log
            /tmp/t095-brush-result.log
            /tmp/t095-oblique.log
            /tmp/t095-axis-scanline.log
            /tmp/t095-oblique-scanlines.log
            /tmp/t095-stage-lookup.log
            /tmp/t095-queue-compaction.log
            /tmp/t095-latency-window.log
            /tmp/t095-stage-batch-window.log
            /tmp/t095-frame-phase.log
            /tmp/t095-frame-backlog.log
            /tmp/t095-postdraw-pairing.log
            /tmp/t095-preview-stage-postdraw.log
            /tmp/t095-preview-input-postdraw.log
            /tmp/t095-trace-analyzer.log
            /tmp/t095-owner-trace.log
            /tmp/t095-hokusai-delta.log
            /tmp/t095-tile-shift.log
            /tmp/t095-tile-commit.log
            /tmp/t095-legacy-tile-commit.log
            /tmp/t095-sparse-preview.log
            /tmp/t095-blend.log
            /tmp/t095-native-hard-atomic.log
