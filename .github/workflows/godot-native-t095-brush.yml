            t169_native_import_fence:T169_IMPORT_PASSED \
            t148_import_subtree_native_revision:T148_IMPORT_RESULT; do
            name="${entry%%:*}"
            marker="${entry#*:}"
            timeout 150s godot --headless --path drawing --script "res://tests/${name}.gd" \
              2>&1 | tee "/tmp/t153-${name}.log"
            python3 tools/check_godot_model_log.py "/tmp/t153-${name}.log" --marker "$marker"
