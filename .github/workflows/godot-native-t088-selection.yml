name: Godot T-088 selection and clipboard native witness (on demand, software only)

on:
  workflow_dispatch:

jobs:
  selection-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install pinned Godot 4.8 beta 3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta3
          use-dotnet: false
      - name: Install software-display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Stage and import canonical standalone Drawing package
        run: |
          set -euo pipefail
          python3 tools/build_drawing_app.py --in-place
          timeout --signal=TERM --kill-after=5s 240s godot --headless --editor --path drawing --import --quit
      - name: Verify native selection mask, live move, keyboard clipboard and exact pixels
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s xvfb-run -a godot --display-driver x11 --rendering-method gl_compatibility \
            --audio-driver Dummy --path drawing --script res://tests/selection_clipboard_native.gd \
            2>&1 | tee /tmp/t088-native.log
          python3 tools/check_native_t088_log.py /tmp/t088-native.log
          python3 -m unittest discover -s tests -p 'test_t088_floating_log.py' -v
      - name: Verify T-139 signed sparse mask outlines in the native framebuffer
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s xvfb-run -a godot --display-driver x11 --rendering-method gl_compatibility \
            --audio-driver Dummy --path drawing --script res://tests/t139_sparse_selection_outline_native.gd \
            2>&1 | tee /tmp/t139-outline-native.log
          grep -Fxq 'T139_NATIVE_PASSED checks=7 failures=0' /tmp/t139-outline-native.log
          python3 tools/check_godot_model_log.py /tmp/t139-outline-native.log --marker T139_NATIVE_PASSED
      - name: Verify T-140 focal-first capped mask outlines and camera re-entry
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s xvfb-run -a godot --display-driver x11 --rendering-method gl_compatibility \
            --audio-driver Dummy --path drawing --script res://tests/t140_focal_mask_overflow_native.gd \
            2>&1 | tee /tmp/t140-outline-native.log
          grep -Fxq 'T140_NATIVE_PASSED checks=9 failures=0' /tmp/t140-outline-native.log
          python3 tools/check_godot_model_log.py /tmp/t140-outline-native.log --marker T140_NATIVE_PASSED
      - name: Verify T-141 exact occupied outlines beyond 4096 tiles
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s xvfb-run -a godot --display-driver x11 --rendering-method gl_compatibility \
            --audio-driver Dummy --path drawing --script res://tests/t141_sparse_mask_overflow_native.gd \
            2>&1 | tee /tmp/t141-outline-native.log
          grep -Fxq 'T141_NATIVE_PASSED checks=8 failures=0' /tmp/t141-outline-native.log
          python3 tools/check_godot_model_log.py /tmp/t141-outline-native.log --marker T141_NATIVE_PASSED
      - name: Upload software-only diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t088-xvfb-selection-clipboard
          path: |
            /tmp/t088-native.log
            /tmp/t139-outline-native.log
            /tmp/t140-outline-native.log
            /tmp/t141-outline-native.log
          if-no-files-found: warn
