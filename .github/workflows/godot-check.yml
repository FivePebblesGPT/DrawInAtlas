name: Godot GDScript checks (fast desktop)

on:
  push:
  pull_request:

jobs:
  smoke-and-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Godot cannot import LFS pointer text as textures.
          lfs: true
      - name: Install Godot 4.8-beta4 (standard, non-.NET)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta4
          use-dotnet: false
          include-templates: true
      - name: Verify the exact beta engine
        shell: bash
        timeout-minutes: 10
        run: |
          godot --version | grep -Fx '4.8.beta4.official.b070e63b1'
          # All runnable consumers require native classes before their first import.
          make test TOOLCHAIN=system
      - name: Enforce explicit types in owned GDScript and skill examples
        id: ci_02_enforce_explicit_types_in_owned_gdscript_and_skill_examples
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 tests/check_explicit_types.py
      - name: Verify CI initializes main project before GDScript smokes
        id: ci_03_verify_ci_initializes_main_project_before_gdscript_smokes
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 -m unittest discover -s tests -p 'test_godot_ci_order.py' -v
      - name: Verify fail-late CI execution and reporting
        id: ci_04_fail_late_contract
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 -m unittest discover -s tests -p 'test_godot_ci_fail_late.py' -v
      - name: Verify T-051 isolated Drawing contract consumer
        id: ci_04_verify_t_051_isolated_drawing_contract_consumer
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_drawing_contract.py' -v
      - name: Verify T-052 extracted independent Drawing core
        id: ci_05_verify_t_052_extracted_independent_drawing_core
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_drawing_core.py' -v
      - name: Verify T-053 isolated standalone Drawing and third package consumer
        id: ci_06_verify_t_053_isolated_standalone_drawing_and_third_package_cons
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_drawing_app.py' -v
      - name: Verify T-085 detached live-stroke preview and history
        id: ci_t085_live_stroke_preview
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          source tools/ci_fail_late.sh
          python3 tools/build_drawing_app.py --in-place
          godot --headless --editor --path drawing --import --quit
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/live_stroke_smoke.gd 2>&1 | tee /tmp/godot-t085-model.log
          python3 tools/check_godot_model_log.py /tmp/godot-t085-model.log --marker T085_MODEL_PASSED || ci_fail_marker 'T085 live-stroke model log rejected'
          # A second Brush/Eraser press while its predecessor drains must not
          # disappear or collapse two independently undoable transactions.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t124_queued_brush_smoke.gd 2>&1 | tee /tmp/godot-t124-queued-brush.log
          python3 tools/check_godot_model_log.py /tmp/godot-t124-queued-brush.log --marker T124_QUEUED_PASSED || ci_fail_marker 'T124 queued Brush history and byte oracle rejected'
          # T-125 prevents Save/Save As, Object publication and Close Tab from
          # observing an unpublished Brush/queued release as a clean snapshot.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t125_pending_persistence_smoke.gd 2>&1 | tee /tmp/godot-t125-persistence.log
          python3 tools/check_godot_model_log.py /tmp/godot-t125-persistence.log --marker T125_PENDING_PASSED || ci_fail_marker 'T125 pending persistence/close rollback rejected'
          python3 -m unittest discover -s tests -p 'test_t125_pending_persistence.py' -v || ci_fail_marker 'T125 persistence contracts rejected'
          # T-126 preserves the same pending and queued strokes on tab/new/open,
          # including TabBar reentrancy and inactive-tab closure attempts.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t126_pending_tab_switch_smoke.gd 2>&1 | tee /tmp/godot-t126-tab-switch.log
          python3 tools/check_godot_model_log.py /tmp/godot-t126-tab-switch.log --marker T126_TAB_SWITCH_PASSED || ci_fail_marker 'T126 pending document switch rejected'
          python3 -m unittest discover -s tests -p 'test_t126_pending_tab_switch.py' -v || ci_fail_marker 'T126 tab-switch contracts rejected'
          # T-127 protects released and queued input from Undo/Redo revision
          # changes; test keyboard, History buttons and chronological pixels.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t127_pending_history_smoke.gd 2>&1 | tee /tmp/godot-t127-history.log
          python3 tools/check_godot_model_log.py /tmp/godot-t127-history.log --marker T127_HISTORY_PASSED || ci_fail_marker 'T127 pending Brush history rejected'
          grep -Fqx 'T127_HISTORY_PASSED checks=40 failures=0' /tmp/godot-t127-history.log || ci_fail_marker 'T127 history assertion count changed'
          python3 -m unittest discover -s tests -p 'test_t127_pending_history.py' -v || ci_fail_marker 'T127 pending Brush source/CI contracts rejected'
          # T-128 closes the History-list row-selection bypass of guarded
          # Undo/Redo while released/queued Brush strokes remain unpublished.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t128_history_list_pending_smoke.gd 2>&1 | tee /tmp/godot-t128-history-list.log
          python3 tools/check_godot_model_log.py /tmp/godot-t128-history-list.log --marker T128_HISTORY_LIST_PASSED || ci_fail_marker 'T128 history list pending Brush guard rejected'
          grep -Fqx 'T128_HISTORY_LIST_PASSED checks=37 failures=0' /tmp/godot-t128-history-list.log || ci_fail_marker 'T128 history list assertion count changed'
          python3 -m unittest discover -s tests -p 'test_t128_history_list_pending.py' -v || ci_fail_marker 'T128 history list source/CI contracts rejected'
          # T-129 rejects non-history layer/text/clipboard revisions while
          # a detached Brush or queued successor still owns its source.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t129_pending_content_edit_smoke.gd 2>&1 | tee /tmp/godot-t129-pending-edits.log
          python3 tools/check_godot_model_log.py /tmp/godot-t129-pending-edits.log --marker T129_PENDING_EDIT_PASSED || ci_fail_marker 'T129 pending source edits failed strict log policy'
          grep -Fqx 'T129_PENDING_EDIT_PASSED checks=35 failures=0' /tmp/godot-t129-pending-edits.log || ci_fail_marker 'T129 assertion count changed'
          python3 -m unittest discover -s tests -p 'test_t129_pending_content_edit.py' -v || ci_fail_marker 'T129 source and CI contracts rejected'
          # T-130 refuses selection and authoring-frame context edits while
          # unpublished Brush/queued input retains its captured source.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t130_pending_source_context_smoke.gd 2>&1 | tee /tmp/godot-t130-pending-context.log
          python3 tools/check_godot_model_log.py /tmp/godot-t130-pending-context.log --marker T130_CONTEXT_PASSED || ci_fail_marker 'T130 pending source context rejected by strict log'
          grep -Fqx 'T130_CONTEXT_PASSED checks=34 failures=0' /tmp/godot-t130-pending-context.log || ci_fail_marker 'T130 source context assertion count changed'
          python3 -m unittest discover -s tests -p 'test_t130_pending_source_context.py' -v || ci_fail_marker 'T130 source and CI contracts rejected'
          # T-131 keeps Object rename and Save As target metadata transactional
          # through pending Brush/queued input and rejected publisher results.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t131_object_pending_metadata_smoke.gd 2>&1 | tee /tmp/godot-t131-object-metadata.log
          python3 tools/check_godot_model_log.py /tmp/godot-t131-object-metadata.log --marker T131_OBJECT_META_PASSED || ci_fail_marker 'T131 Object source metadata guard failed strict log'
          grep -Fqx 'T131_OBJECT_META_PASSED checks=21 failures=0' /tmp/godot-t131-object-metadata.log || ci_fail_marker 'T131 Object metadata assertion count changed'
          python3 -m unittest discover -s tests -p 'test_t131_object_pending_metadata.py' -v || ci_fail_marker 'T131 source/CI contracts rejected'
          # T-132 binds asynchronous file and Object Save As completion to
          # the tab/document/session that opened the chooser, never the next tab.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t132_dialog_document_identity_smoke.gd 2>&1 | tee /tmp/godot-t132-dialog-target.log
          python3 tools/check_godot_model_log.py /tmp/godot-t132-dialog-target.log --marker T132_DIALOG_PASSED || ci_fail_marker 'T132 dialog source identity rejected by strict log'
          grep -Fqx 'T132_DIALOG_PASSED checks=34 failures=0' /tmp/godot-t132-dialog-target.log || ci_fail_marker 'T132 dialog source identity assertion count changed'
          python3 -m unittest discover -s tests -p 'test_t132_dialog_document_identity.py' -v || ci_fail_marker 'T132 source/CI contract rejected'
          # T-133 intercepts standalone OS window-close requests and reuses
          # explicit per-tab Save/Discard/Cancel without losing pending Brush.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t133_window_quit_smoke.gd 2>&1 | tee /tmp/godot-t133-window-quit.log
          python3 tools/check_godot_model_log.py /tmp/godot-t133-window-quit.log --marker T133_WINDOW_QUIT_PASSED || ci_fail_marker 'T133 window close failed strict log policy'
          grep -Fqx 'T133_WINDOW_QUIT_PASSED checks=31 failures=0' /tmp/godot-t133-window-quit.log || ci_fail_marker 'T133 window quit assertion count changed'
          python3 -m unittest discover -s tests -p 'test_t133_window_quit.py' -v || ci_fail_marker 'T133 source/CI contracts rejected'
          # T-134 binds authoring modal confirmation to the originating tab,
          # selected layer and document revision (without changing direct APIs).
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t134_authoring_dialog_identity_smoke.gd 2>&1 | tee /tmp/godot-t134-authoring-dialog.log
          python3 tools/check_godot_model_log.py /tmp/godot-t134-authoring-dialog.log --marker T134_DIALOG_PASSED || ci_fail_marker 'T134 authoring dialog origin rejected by strict log'
          grep -Fqx 'T134_DIALOG_PASSED checks=22 failures=0' /tmp/godot-t134-authoring-dialog.log || ci_fail_marker 'T134 authoring dialog assertion count changed'
          python3 -m unittest discover -s tests -p 'test_t134_authoring_dialog_identity.py' -v || ci_fail_marker 'T134 authoring source/CI contracts rejected'
          # T-095 60px Brush/Eraser exact-pixel and rollback oracle is mandatory;
          # its pointer/framebuffer timing witness stays opt-in and software-only.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/brush_coverage_smoke.gd 2>&1 | tee /tmp/godot-t095-oracle.log
          python3 tools/check_godot_model_log.py /tmp/godot-t095-oracle.log --marker T095_ORACLE_PASSED || ci_fail_marker 'T095 Brush/Eraser independent pixel oracle rejected'
          # T-211: native Hokusai is mandatory. The old scripted pigment ABI
          # bridge was deleted in T-153; require actual native rollback/retry,
          # hidden-RGB and signed publication instead of its un-runnable stub.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t095_native_pigment_atomic.gd 2>&1 | tee /tmp/godot-t095-native-pigment.log
          python3 tools/check_godot_model_log.py /tmp/godot-t095-native-pigment.log --marker T095_NATIVE_PIGMENT_ATOMIC_PASSED || ci_fail_marker 'T095 native pigment rollback rejected'
          grep -Fqx 'T095_NATIVE_PIGMENT_ATOMIC_RESULT checks=57 failures=0' /tmp/godot-t095-native-pigment.log || ci_fail_marker 'T095 native pigment assertion count changed'
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t158_signed_lazy_tile_bounds.gd 2>&1 | tee /tmp/godot-t158-signed-bounds.log
          python3 tools/check_godot_model_log.py /tmp/godot-t158-signed-bounds.log --marker T158_TILE_BOUNDS_PASSED || ci_fail_marker 'T158 native signed tile bounds rejected'
          grep -Fqx 'T158_TILE_BOUNDS_PASSED checks=24 failures=0' /tmp/godot-t158-signed-bounds.log || ci_fail_marker 'T158 signed tile assertion count changed'
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t159_signed_replay_publication_bounds.gd 2>&1 | tee /tmp/godot-t159-signed-replay.log
          python3 tools/check_godot_model_log.py /tmp/godot-t159-signed-replay.log --marker T159_SIGNED_REPLAY_PASSED || ci_fail_marker 'T159 native signed replay rejected'
          grep -Fqx 'T159_SIGNED_REPLAY_PASSED checks=39 failures=0' /tmp/godot-t159-signed-replay.log || ci_fail_marker 'T159 signed replay assertion count changed'
          # T-230: even the first legacy-pixel Undo/Redo in a detached document
          # must bootstrap Rust ownership before advancing the host timeline.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t230_detached_pixel_bootstrap.gd 2>&1 | tee /tmp/godot-t230-pixel-bootstrap.log
          python3 tools/check_godot_model_log.py /tmp/godot-t230-pixel-bootstrap.log --marker T230_PIXEL_BOOTSTRAP_PASSED || ci_fail_marker 'T230 detached legacy pixel native bootstrap rejected'
          grep -Fqx 'T230_PIXEL_BOOTSTRAP_PASSED checks=33 failures=0' /tmp/godot-t230-pixel-bootstrap.log || ci_fail_marker 'T230 detached pixel bootstrap assertion count changed'
          # T-231 bounds direct pixel/tile adoption before source resolution
          # and Rust PackedByteArray-to-Vec copies, even with 2048px tiles.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t231_direct_native_transfer_budget.gd 2>&1 | tee /tmp/godot-t231-direct-budget.log
          python3 tools/check_godot_model_log.py /tmp/godot-t231-direct-budget.log --marker T231_DIRECT_BUDGET_PASSED || ci_fail_marker 'T231 native direct transfer budget rejected'
          grep -Fqx 'T231_DIRECT_BUDGET_PASSED checks=24 failures=0' /tmp/godot-t231-direct-budget.log || ci_fail_marker 'T231 direct transfer assertion count changed'
          # T-232 gives the first tile-local non-Brush edit an atomic Rust
          # owner, preserving hidden RGB, host history, and failed-bootstrap rollback.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t232_tile_native_bootstrap.gd 2>&1 | tee /tmp/godot-t232-tile-bootstrap.log
          python3 tools/check_godot_model_log.py /tmp/godot-t232-tile-bootstrap.log --marker T232_TILE_BOOTSTRAP_PASSED || ci_fail_marker 'T232 first tile-local native ownership rejected'
          grep -Fqx 'T232_TILE_BOOTSTRAP_PASSED checks=34 failures=0' /tmp/godot-t232-tile-bootstrap.log || ci_fail_marker 'T232 tile-local native bootstrap assertion count changed'
          # T-233 gives the first direct/mixed pixel-map publication a bounded
          # Rust owner; old pixel deltas remain supported as historical input.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t233_pixel_native_bootstrap.gd 2>&1 | tee /tmp/godot-t233-pixel-bootstrap.log
          python3 tools/check_godot_model_log.py /tmp/godot-t233-pixel-bootstrap.log --marker T233_PIXEL_BOOTSTRAP_PASSED || ci_fail_marker 'T233 first direct pixel-map native ownership rejected'
          grep -Fqx 'T233_PIXEL_BOOTSTRAP_PASSED checks=37 failures=0' /tmp/godot-t233-pixel-bootstrap.log || ci_fail_marker 'T233 direct pixel bootstrap assertion count changed'
          # T-234 validates the whole native Brush publication envelope and
          # freezes descriptors before any lazy source callbacks.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t234_native_publication_preflight.gd 2>&1 | tee /tmp/godot-t234-publication.log
          python3 tools/check_godot_model_log.py /tmp/godot-t234-publication.log --marker T234_NATIVE_PUBLICATION_PASSED || ci_fail_marker 'T234 native publication preflight rejected'
          grep -Fqx 'T234_NATIVE_PUBLICATION_PASSED checks=32 failures=0' /tmp/godot-t234-publication.log || ci_fail_marker 'T234 native publication assertion count changed'
          # T-235 validates all direct tile-local patches before lazy sources
          # and rejects reentrant descriptor/content mutation before adoption.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t235_tile_patch_preflight.gd 2>&1 | tee /tmp/godot-t235-tile-preflight.log
          python3 tools/check_godot_model_log.py /tmp/godot-t235-tile-preflight.log --marker T235_TILE_PREFLIGHT_PASSED || ci_fail_marker 'T235 tile-local patch descriptor/reentrancy preflight rejected'
          grep -Fqx 'T235_TILE_PREFLIGHT_PASSED checks=34 failures=0' /tmp/godot-t235-tile-preflight.log || ci_fail_marker 'T235 tile-local assertion count changed'
          # T-236 validates the complete direct pixel-map descriptor set
          # before lazy sources, then rejects reentrant map/source mutations.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t236_pixel_map_preflight.gd 2>&1 | tee /tmp/godot-t236-pixel-preflight.log
          python3 tools/check_godot_model_log.py /tmp/godot-t236-pixel-preflight.log --marker T236_PIXEL_PREFLIGHT_PASSED || ci_fail_marker 'T236 direct pixel-map descriptor/reentrancy preflight rejected'
          grep -Fqx 'T236_PIXEL_PREFLIGHT_PASSED checks=35 failures=0' /tmp/godot-t236-pixel-preflight.log || ci_fail_marker 'T236 pixel-map assertion count changed'
          # T-237 freezes complete detached native tile history before any
          # lazy source and rejects reentrant payload/token changes before Rust.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t237_detached_tile_replay_preflight.gd 2>&1 | tee /tmp/godot-t237-history-preflight.log
          python3 tools/check_godot_model_log.py /tmp/godot-t237-history-preflight.log --marker T237_HISTORY_PREFLIGHT_PASSED || ci_fail_marker 'T237 detached native tile-history descriptor/reentrancy preflight rejected'
          grep -Fqx 'T237_HISTORY_PREFLIGHT_PASSED checks=40 failures=0' /tmp/godot-t237-history-preflight.log || ci_fail_marker 'T237 detached tile-history assertion count changed'
          # T-238 revalidates previously resolved Brush source bytes after
          # later lazy callbacks, even when the source object is unchanged.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t238_brush_source_reentrancy.gd 2>&1 | tee /tmp/godot-t238-brush-source.log
          python3 tools/check_godot_model_log.py /tmp/godot-t238-brush-source.log --marker T238_BRUSH_SOURCE_PASSED || ci_fail_marker 'T238 Brush source-byte reentrancy rejected'
          grep -Fqx 'T238_BRUSH_SOURCE_PASSED checks=18 failures=0' /tmp/godot-t238-brush-source.log || ci_fail_marker 'T238 Brush source assertion count changed'
          # T-239 keeps live host-owned native tokens in strict Undo/Redo
          # order while retaining detached replay for evicted history.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t239_native_history_order.gd 2>&1 | tee /tmp/godot-t239-history-order.log
          python3 tools/check_godot_model_log.py /tmp/godot-t239-history-order.log --marker T239_HISTORY_ORDER_PASSED || ci_fail_marker 'T239 retained native history ordering rejected'
          grep -Fqx 'T239_HISTORY_ORDER_PASSED checks=36 failures=0' /tmp/godot-t239-history-order.log || ci_fail_marker 'T239 history-order assertion count changed'
          # T-240 preflights entire Rust FFI tile descriptor arrays before
          # copying full RGBA8 buffers or accounting rejected tile spans.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t240_native_ffi_payload_preflight.gd 2>&1 | tee /tmp/godot-t240-ffi-preflight.log
          python3 tools/check_godot_model_log.py /tmp/godot-t240-ffi-preflight.log --marker T240_FFI_PREFLIGHT_PASSED || ci_fail_marker 'T240 native FFI payload preflight rejected'
          grep -Fqx 'T240_FFI_PREFLIGHT_PASSED checks=32 failures=0' /tmp/godot-t240-ffi-preflight.log || ci_fail_marker 'T240 FFI payload assertion count changed'
          # T-241 prevents a host-owned native history timeline from being
          # silently replaced by an empty local timeline after a revision.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t241_host_history_owner_fence.gd 2>&1 | tee /tmp/godot-t241-host-owner.log
          python3 tools/check_godot_model_log.py /tmp/godot-t241-host-owner.log --marker T241_HOST_OWNER_PASSED || ci_fail_marker 'T241 host-owned history handoff rejected'
          grep -Fqx 'T241_HOST_OWNER_PASSED checks=29 failures=0' /tmp/godot-t241-host-owner.log || ci_fail_marker 'T241 host owner assertion count changed'
          # T-242 makes the host-ownership flag getter-only: direct and
          # reflective writes must not bypass T-241's checked handoff.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t242_history_mode_readonly.gd 2>&1 | tee /tmp/godot-t242-history-mode.log
          python3 tools/check_godot_model_log.py /tmp/godot-t242-history-mode.log --marker T242_HISTORY_MODE_PASSED || ci_fail_marker 'T242 history ownership property guard rejected'
          grep -Fqx 'T242_HISTORY_MODE_PASSED checks=25 failures=0' /tmp/godot-t242-history-mode.log || ci_fail_marker 'T242 history mode assertion count changed'
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path . --script res://tests/t242_atlas_history_mode_readonly.gd 2>&1 | tee /tmp/godot-t242-atlas-mode.log
          python3 tools/check_godot_model_log.py /tmp/godot-t242-atlas-mode.log --marker T242_ATLAS_MODE_PASSED || ci_fail_marker 'T242 Atlas history ownership property guard rejected'
          grep -Fqx 'T242_ATLAS_MODE_PASSED checks=18 failures=0' /tmp/godot-t242-atlas-mode.log || ci_fail_marker 'T242 Atlas assertion count changed'
          # T-243 prevents native edits from changing their command owner
          # between a Rust begin_edit and its eventual commit/cancellation.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t243_active_history_handoff.gd 2>&1 | tee /tmp/godot-t243-active-owner.log
          python3 tools/check_godot_model_log.py /tmp/godot-t243-active-owner.log --marker T243_ACTIVE_OWNER_PASSED || ci_fail_marker 'T243 active native history handoff rejected'
          grep -Fqx 'T243_ACTIVE_OWNER_PASSED checks=40 failures=0' /tmp/godot-t243-active-owner.log || ci_fail_marker 'T243 active history assertion count changed'
          # T-244 reserves local/Atlas command ownership during pending
          # GDScript EditSessions, even before Rust attaches or stages pixels.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy --path drawing --script res://tests/t244_pending_session_history_handoff.gd 2>&1 | tee /tmp/godot-t244-pending-session.log
