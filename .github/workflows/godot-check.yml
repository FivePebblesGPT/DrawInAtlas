name: Godot GDScript checks (fast desktop)

on:
  push:
  pull_request:

jobs:
  smoke-and-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Godot cannot import LFS pointer text as textures.
          lfs: true
      - name: Install Godot 4.8-beta3 (standard, non-.NET)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta3
          use-dotnet: false
          include-templates: true
      - name: Verify the exact beta engine
        shell: bash
        run: godot --version | grep -E '^4\.8\.beta3\.official\.'
      - name: Enforce explicit types in owned GDScript and skill examples
        id: ci_02_enforce_explicit_types_in_owned_gdscript_and_skill_examples
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 tests/check_explicit_types.py
      - name: Verify CI initializes main project before GDScript smokes
        id: ci_03_verify_ci_initializes_main_project_before_gdscript_smokes
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 -m unittest discover -s tests -p 'test_godot_ci_order.py' -v
      - name: Verify fail-late CI execution and reporting
        id: ci_04_fail_late_contract
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 -m unittest discover -s tests -p 'test_godot_ci_fail_late.py' -v
      - name: Verify T-051 isolated Drawing contract consumer
        id: ci_04_verify_t_051_isolated_drawing_contract_consumer
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_drawing_contract.py' -v
      - name: Verify T-052 extracted independent Drawing core
        id: ci_05_verify_t_052_extracted_independent_drawing_core
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_drawing_core.py' -v
      - name: Verify T-053 isolated standalone Drawing and third package consumer
        id: ci_06_verify_t_053_isolated_standalone_drawing_and_third_package_cons
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_drawing_app.py' -v
      - name: Verify T-085 detached live-stroke preview and history
        id: ci_t085_live_stroke_preview
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          source tools/ci_fail_late.sh
          python3 tools/build_drawing_app.py --in-place
          godot --headless --editor --path drawing --import --quit
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/live_stroke_smoke.gd 2>&1 | tee /tmp/godot-t085-model.log
          python3 tools/check_godot_model_log.py /tmp/godot-t085-model.log --marker T085_MODEL_PASSED || ci_fail_marker 'T085 live-stroke model log rejected'
          # T-095 60px Brush/Eraser exact-pixel and rollback oracle is mandatory;
          # its pointer/framebuffer timing witness stays opt-in and software-only.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/brush_coverage_smoke.gd 2>&1 | tee /tmp/godot-t095-oracle.log
          python3 tools/check_godot_model_log.py /tmp/godot-t095-oracle.log --marker T095_ORACLE_PASSED || ci_fail_marker 'T095 Brush/Eraser independent pixel oracle rejected'
          # T-095 Hokusai batch delta staging must match the original pixel
          # transaction path even when no optional Rust binary is installed.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/hokusai_bulk_delta_smoke.gd 2>&1 | tee /tmp/godot-t095-hokusai-delta.log
          python3 tools/check_godot_model_log.py /tmp/godot-t095-hokusai-delta.log --marker T095_BULK_DELTA_PASSED || ci_fail_marker 'T095 Hokusai bulk delta model log rejected'
          ci_finish
      - name: Verify T-086 source-space dirty-display tile invalidation
        id: ci_t086_viewport_cache_model
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          source tools/ci_fail_late.sh
          python3 tools/build_drawing_app.py --in-place
          godot --headless --editor --path drawing --import --quit
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/viewport_cache_smoke.gd 2>&1 | tee /tmp/godot-t086-cache-model.log
          python3 tools/check_godot_model_log.py /tmp/godot-t086-cache-model.log --marker T086_MODEL_PASSED || ci_fail_marker 'T086 viewport model log rejected'
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/viewport_cache_focus_smoke.gd 2>&1 | tee /tmp/godot-t086-cache-focus.log
          python3 tools/check_godot_model_log.py /tmp/godot-t086-cache-focus.log --marker T086_FOCUS_PASSED || ci_fail_marker 'T086 dense viewport retention priority witness error'
          # T-102 bounded cold scheduling: signed focal priority, dirty/preview
          # invalidation and conservative over-budget/unknown occupancy fallback.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/t102_cold_population_smoke.gd 2>&1 | tee /tmp/godot-t102-cold-population.log
          python3 tools/check_godot_model_log.py /tmp/godot-t102-cold-population.log --marker T102_MODEL_PASSED || ci_fail_marker 'T102 cold population scheduling log rejected'
          # T-103 software-only over-budget focal preselection and safe fallbacks.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/t103_retention_plan_smoke.gd 2>&1 | tee /tmp/godot-t103-retention.log
          python3 tools/check_godot_model_log.py /tmp/godot-t103-retention.log --marker T103_MODEL_PASSED || ci_fail_marker 'T103 focal retention planner rejected'
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/renderer_cold_tile_smoke.gd 2>&1 | tee /tmp/godot-t086-cold-model.log
          python3 tools/check_godot_model_log.py /tmp/godot-t086-cold-model.log --marker T086_COLD_PASSED || ci_fail_marker 'T086 cold renderer parity witness error'
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/renderer_sparse_pixel_smoke.gd 2>&1 | tee /tmp/godot-t086-sparse-pixels.log
          python3 tools/check_godot_model_log.py /tmp/godot-t086-sparse-pixels.log --marker T086_SPARSE_PIXEL_PASSED || ci_fail_marker 'T086 sparse source-pixel oracle rejected'
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/renderer_visible_plan_smoke.gd 2>&1 | tee /tmp/godot-t086-visible-plan.log
          python3 tools/check_godot_model_log.py /tmp/godot-t086-visible-plan.log --marker T086_PLAN_PASSED || ci_fail_marker 'T086 visible-layer plan parity witness error'
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/renderer_shared_chunks_smoke.gd 2>&1 | tee /tmp/godot-t086-shared-chunks.log
          python3 tools/check_godot_model_log.py /tmp/godot-t086-shared-chunks.log --marker T086_SHARED_PASSED || ci_fail_marker 'T086 shared source-chunk cache parity witness error'
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/renderer_sparse_layer_smoke.gd 2>&1 | tee /tmp/godot-t086-sparse-layers.log
          python3 tools/check_godot_model_log.py /tmp/godot-t086-sparse-layers.log --marker T086_SPARSE_PASSED || ci_fail_marker 'T086 sparse-layer source culling parity witness error'
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/viewport_preview_index_smoke.gd 2>&1 | tee /tmp/godot-t086-preview-index.log
          python3 tools/check_godot_model_log.py /tmp/godot-t086-preview-index.log --marker T086_PREVIEW_INDEX_PASSED || ci_fail_marker 'T086 bounded preview index parity witness error'
          python3 -m unittest discover -s tests -p 'test_t086_benchmark_fixtures.py' -v || ci_fail_marker 'T086 historical fixture integrity contract failure'
          ci_finish
      - name: Verify T-087 standalone image frame, portable metadata and independent grid
        id: ci_t087_image_frame_model
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          source tools/ci_fail_late.sh
          python3 tools/build_drawing_app.py --in-place
          godot --headless --editor --path drawing --import --quit
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/image_frame_smoke.gd 2>&1 | tee /tmp/godot-t087-frame-model.log
          python3 tools/check_godot_model_log.py /tmp/godot-t087-frame-model.log --marker T087_MODEL_PASSED || ci_fail_marker 'T087_MODEL_PASSED log rejected'
          ci_finish
      - name: Verify T-088 selection channel, clipboard, and transaction history
        id: ci_t088_selection_clipboard_model
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          source tools/ci_fail_late.sh
          python3 tools/build_drawing_app.py --in-place
          godot --headless --editor --path drawing --import --quit
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/selection_clipboard_smoke.gd 2>&1 | tee /tmp/godot-t088-selection-model.log
          python3 tools/check_godot_model_log.py /tmp/godot-t088-selection-model.log --marker T088_MODEL_PASSED || ci_fail_marker 'T088_MODEL_PASSED log rejected'
          # T-088 sparse transparent Paste must match a separate dense source oracle.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/selection_sparse_paste_smoke.gd 2>&1 | tee /tmp/godot-t088-sparse-paste.log
          python3 tools/check_godot_model_log.py /tmp/godot-t088-sparse-paste.log --marker T088_SPARSE_PASTE_PASSED || ci_fail_marker 'T088 sparse paste source oracle rejected'
          # T-088 capture must skip empty source tiles and preserve lazy-source failures.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/selection_sparse_capture_smoke.gd 2>&1 | tee /tmp/godot-t088-sparse-capture.log
          python3 tools/check_godot_model_log.py /tmp/godot-t088-sparse-capture.log --marker T088_SPARSE_CAPTURE_PASSED || ci_fail_marker 'T088 sparse capture source oracle rejected'
          # T-096 exact large-mask contours/Move source oracle is mandatory;
          # real pointer/display and owner acceptance remain separate.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/selection_large_smoke.gd 2>&1 | tee /tmp/godot-t096-model.log
          python3 tools/check_godot_model_log.py /tmp/godot-t096-model.log --marker T096_MODEL_PASSED || ci_fail_marker 'T096 large selection and Move oracle rejected'
          ci_finish
      - name: Verify T-089 layer hierarchy, row actions, and structural history
        id: ci_t089_layer_structure_model
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          source tools/ci_fail_late.sh
          python3 tools/build_drawing_app.py --in-place
          godot --headless --editor --path drawing --import --quit
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/layer_structure_smoke.gd 2>&1 | tee /tmp/godot-t089-layers-model.log
          python3 tools/check_godot_model_log.py /tmp/godot-t089-layers-model.log --marker T089_MODEL_PASSED || ci_fail_marker 'T089 layers model log rejected'
          ci_finish
      - name: Verify T-090 responsive workspace, command routing, and licensed tool icon contracts
        id: ci_t090_responsive_workspace_contracts
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          source tools/ci_fail_late.sh
          python3 -m unittest discover -s tests -p 'test_t090_responsive_workspace.py' -v
          python3 tools/build_drawing_app.py --in-place
          godot --headless --editor --path drawing --import --quit
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/topbar_overflow_smoke.gd 2>&1 | tee /tmp/godot-t090-overflow.log
          python3 tools/check_godot_model_log.py /tmp/godot-t090-overflow.log --marker T090_OVERFLOW_PASSED || ci_fail_marker 'T090 overflow checkmark and command parity rejected'
          ci_finish
      - name: Verify T-091 one-group floating dock and legacy settings migration
        id: ci_t091_single_group_docking_model
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          source tools/ci_fail_late.sh
          python3 tools/build_drawing_app.py --in-place
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/dock_single_group_smoke.gd 2>&1 | tee /tmp/godot-t091-dock-model.log
          python3 tools/check_godot_model_log.py /tmp/godot-t091-dock-model.log --marker T091_MODEL_PASSED || ci_fail_marker 'T091 docking model log rejected'
          python3 -m unittest discover -s tests -p 'test_t091_dock.py' -v
          ci_finish
      - name: Verify T-092 compact Colors, history cursor, and isolated app preferences
        id: ci_t092_compact_color_history_model
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          source tools/ci_fail_late.sh
          python3 tools/build_drawing_app.py --in-place
          godot --headless --editor --path drawing --import --quit
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/color_history_smoke.gd 2>&1 | tee /tmp/godot-t092-model.log
          python3 tools/check_godot_model_log.py /tmp/godot-t092-model.log --marker T092_MODEL_PASSED || ci_fail_marker 'T092 Colors/History model log rejected'
          python3 -m unittest discover -s tests -p 'test_t092_color_history.py' -v
          ci_finish
      - name: Verify T-093 Object source discovery, recent-root consent, image import and safe Open
        id: ci_t093_object_discovery_model
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          source tools/ci_fail_late.sh
          python3 tools/build_drawing_app.py --in-place
          godot --headless --editor --path drawing --import --quit
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/object_discovery_smoke.gd 2>&1 | tee /tmp/godot-t093-discovery-model.log
          python3 tools/check_godot_model_log.py /tmp/godot-t093-discovery-model.log --marker T093_MODEL_PASSED || ci_fail_marker 'T093 Object discovery model log rejected'
          python3 -m unittest discover -s tests -p 'test_t093_object_discovery.py' -v
          ci_finish
      - name: Verify T-053 standalone Linux release package
        id: ci_07_verify_t_053_standalone_linux_release_package
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # A fresh isolated stage is required even on repeated CI replays.
          release_root="$(mktemp -d "${TMPDIR:-/tmp}/drawing-dist.XXXXXXXX")"
          trap 'rm -rf "$release_root"' EXIT
          python3 tools/build_drawing_app.py --output "$release_root/project"
          godot --headless --editor --path "$release_root/project" --import --quit
          godot --headless --path "$release_root/project" --export-release Linux "$release_root/Drawing.x86_64"
          test -s "$release_root/Drawing.x86_64"
          test -s "$release_root/Drawing.pck"
          # Font bytes ship as imported .fontdata, not raw .ttf.
          # Probe the exported PCK rather than editor source files.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path "$release_root" --main-pack "$release_root/Drawing.pck" \
            --script "$release_root/project/tests/packaged_fonts_smoke.gd" \
            2>&1 | tee /tmp/godot-export-fonts.log
          python3 tools/check_godot_model_log.py /tmp/godot-export-fonts.log --marker DRAWING_PACK_FONT_PASSED
          # Inspect the exported ELF/PCK and launch with a disposable HOME/CWD.
          python3 tools/benchmarks/t068_release_gate.py \
            --stage "$release_root/project" --linux "$release_root" \
            --launch-linux --output /tmp/t068-standalone-linux-release.json
      # The standalone package import above only registers *its* classes.
      # The main checkout needs its own class cache before any --path . --script smoke.
      - name: Import resources and parse scripts
        id: ci_08_import_resources_and_parse_scripts
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:|Compile Error:' /tmp/godot-import.log; then exit 1; fi
      - name: Verify T-015 retired battlemat authoring and marker-only links
        id: ci_t015_retired_battlemat_authoring
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          source tools/ci_fail_late.sh
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/t015_retirement_smoke.gd 2>&1 | tee /tmp/godot-t015-retirement.log
          grep -q 'ATLAS_T015_RETIREMENT_PASSED' /tmp/godot-t015-retirement.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-t015-retirement.log; then ci_fail_marker 'Forbidden error marker'; fi
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/links_smoke.gd 2>&1 | tee /tmp/godot-t015-links.log
          grep -q 'ATLAS_LINKS_PASSED' /tmp/godot-t015-links.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-t015-links.log; then ci_fail_marker 'Forbidden error marker'; fi
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/linked_maps_ui_smoke.gd 2>&1 | tee /tmp/godot-t015-link-ui.log
          grep -q 'ATLAS_LINKED_MAPS_UI_PASSED' /tmp/godot-t015-link-ui.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-t015-link-ui.log; then ci_fail_marker 'Forbidden error marker'; fi
          # Active archival-boundary and modern navigation witnesses: former
          # spatial placement previews are deliberately not an authoring surface.
          for witness in \
              't015_archived_geometry_smoke.gd:ATLAS_T015_ARCHIVE_PASSED' \
              'overview_smoke.gd:ATLAS_OVERVIEW_PASSED' \
              'layer_hierarchy_smoke.gd:ATLAS_LAYER_HIERARCHY_PASSED' \
              'search_stale_actions_smoke.gd:ATLAS_SEARCH_STALE_PASSED' \
              'organization_ui_smoke.gd:ATLAS_ORGANIZATION_UI_PASSED' \
              'references_ui_smoke.gd:ATLAS_REFERENCES_UI_PASSED'; do
            file="${witness%%:*}"
            marker="${witness#*:}"
            log="/tmp/godot-t015-${file%.gd}.log"
            timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script "res://tests/$file" 2>&1 | tee "$log"
            grep -q "$marker" "$log"
            if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' "$log"; then ci_fail_marker 'Forbidden error marker'; fi
          done
          ci_finish
      - name: Verify T-054 Drawing/Atlas chronological history
        id: ci_09_verify_t_054_drawing_atlas_chronological_history
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          source tools/ci_fail_late.sh
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/drawing_history_smoke.gd 2>&1 | tee /tmp/godot-drawing-history.log
          grep -q 'DRAWING_HISTORY_PASSED' /tmp/godot-drawing-history.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|failed;' /tmp/godot-drawing-history.log; then ci_fail_marker 'Forbidden error marker'; fi
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/drawing_history_editor_smoke.gd 2>&1 | tee /tmp/godot-drawing-history-editor.log
          grep -q 'DRAWING_HISTORY_EDITOR_PASSED' /tmp/godot-drawing-history-editor.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-drawing-history-editor.log; then ci_fail_marker 'Forbidden error marker'; fi
          ci_finish
      - name: Verify T-058 editable text, font integrity and undoable rasterization
        id: ci_10_verify_t_058_editable_text_font_integrity_and_undoable_rasteriz
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          source tools/ci_fail_late.sh
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/drawing_text_smoke.gd 2>&1 | tee /tmp/godot-drawing-text.log
          python3 tools/check_godot_model_log.py /tmp/godot-drawing-text.log --marker DRAWING_TEXT_PASSED || ci_fail_marker 'DRAWING_TEXT_PASSED log rejected'
          python3 tools/build_drawing_app.py --in-place
          # Staging refreshes font files: let Godot generate their imported FontFile resources.
          godot --headless --editor --path drawing --import --quit
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/text_editor_smoke.gd 2>&1 | tee /tmp/godot-drawing-text-ui.log
          python3 tools/check_godot_model_log.py /tmp/godot-drawing-text-ui.log --marker DRAWING_TEXT_UI_PASSED || ci_fail_marker 'DRAWING_TEXT_UI_PASSED log rejected'
          ci_finish
      - name: Verify T-060 reusable Object Assets and atomic Save As
        id: ci_11_verify_t_060_reusable_object_assets_and_atomic_save_as
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/object_assets_smoke.gd 2>&1 | tee /tmp/godot-object-assets.log
          grep -q 'OBJECT_ASSETS_PASSED' /tmp/godot-object-assets.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|OBJECT_ASSETS_FAILED:' /tmp/godot-object-assets.log; then exit 1; fi
      - name: Verify T-064 nested Object child graph, safe saves and cycle rejection
        id: ci_11b_verify_t_064_nested_object_graph
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/object_child_graph_smoke.gd 2>&1 | tee /tmp/godot-t064-child-graph.log
          grep -q 'T064_CHILD_GRAPH_PASSED' /tmp/godot-t064-child-graph.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T064_CHILD_GRAPH_FAILED:' /tmp/godot-t064-child-graph.log; then exit 1; fi
      - name: Verify T-064 atomic nested Objects project copying
        id: ci_t064_nested_project_copy
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/object_nested_project_copy_smoke.gd 2>&1 | tee /tmp/godot-t064-project-copy.log
          python3 tools/check_godot_model_log.py /tmp/godot-t064-project-copy.log --marker T064_PROJECT_COPY_PASSED
          # A saved portable campaign copy includes all retained Drawing/Objects/
          # Fonts generations, verified before one destination directory rename.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/object_nested_campaign_copy_smoke.gd 2>&1 | tee /tmp/godot-t064-campaign-copy.log
          python3 tools/check_godot_model_log.py /tmp/godot-t064-campaign-copy.log --marker T064_CAMPAIGN_COPY_PASSED
          # Atlas File > Copy saved campaign routes through the same verified API.
