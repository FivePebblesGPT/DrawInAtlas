          timeout --signal=TERM --kill-after=5s 240s xvfb-run -a godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path . --script res://tests/drawing_composition_visual.gd 2>&1 | tee /tmp/godot-t055-native.log
          grep -q 'T055_NATIVE_PASSED' /tmp/godot-t055-native.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T055_NATIVE_FAILED:' /tmp/godot-t055-native.log; then exit 1; fi
      - name: Verify T-068 native pointer-to-frame submission latency and raster parity
        id: ci_76_verify_t_068_native_pointer_to_frame_submission_latency_and_ras
        if: ${{ !cancelled() }}
