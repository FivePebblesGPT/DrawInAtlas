name: Godot GDScript checks (fast desktop)

on:
  push:
  pull_request:

jobs:
  smoke-and-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Godot cannot import LFS pointer text as textures.
          lfs: true
      - name: Install Godot 4.8-beta2 (standard, non-.NET)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta2
          use-dotnet: false
          include-templates: true
      - name: Verify the exact beta engine
        shell: bash
        run: godot --version | grep -E '^4\.8\.beta2\.official\.'
      - name: Enforce explicit types in owned GDScript and skill examples
        id: ci_02_enforce_explicit_types_in_owned_gdscript_and_skill_examples
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 tests/check_explicit_types.py
      - name: Verify CI initializes main project before GDScript smokes
        id: ci_03_verify_ci_initializes_main_project_before_gdscript_smokes
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 -m unittest discover -s tests -p 'test_godot_ci_order.py' -v
      - name: Verify fail-late CI execution and reporting
        id: ci_04_fail_late_contract
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 -m unittest discover -s tests -p 'test_godot_ci_fail_late.py' -v
      - name: Verify T-051 isolated Drawing contract consumer
        id: ci_04_verify_t_051_isolated_drawing_contract_consumer
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_drawing_contract.py' -v
      - name: Verify T-052 extracted independent Drawing core
        id: ci_05_verify_t_052_extracted_independent_drawing_core
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_drawing_core.py' -v
      - name: Verify T-053 isolated standalone Drawing and third package consumer
        id: ci_06_verify_t_053_isolated_standalone_drawing_and_third_package_cons
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_drawing_app.py' -v
      - name: Verify T-053 standalone Linux release package
        id: ci_07_verify_t_053_standalone_linux_release_package
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/drawing-dist
          python3 tools/build_drawing_app.py --output /tmp/drawing-dist/project
          godot --headless --editor --path /tmp/drawing-dist/project --import --quit
          godot --headless --path /tmp/drawing-dist/project --export-release Linux /tmp/drawing-dist/Drawing.x86_64
          test -s /tmp/drawing-dist/Drawing.x86_64
          test -s /tmp/drawing-dist/Drawing.pck
          # Godot keeps font bytes inside imported .fontdata, not raw .ttf paths.
          # Run a source-side probe against the exported PCK (never the editor tree).
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path /tmp/drawing-dist --main-pack /tmp/drawing-dist/Drawing.pck \
            --script /tmp/drawing-dist/project/tests/packaged_fonts_smoke.gd \
            2>&1 | tee /tmp/godot-export-fonts.log
          grep -q 'DRAWING_PACK_FONT_PASSED' /tmp/godot-export-fonts.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-export-fonts.log; then exit 1; fi
      # The standalone package import above only registers *its* classes.
      # The main checkout needs its own class cache before any --path . --script smoke.
      - name: Import resources and parse scripts
        id: ci_08_import_resources_and_parse_scripts
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:|Compile Error:' /tmp/godot-import.log; then exit 1; fi
      - name: Verify T-015 retired battlemat authoring and marker-only links
        id: ci_t015_retired_battlemat_authoring
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          source tools/ci_fail_late.sh
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/t015_retirement_smoke.gd 2>&1 | tee /tmp/godot-t015-retirement.log
          grep -q 'ATLAS_T015_RETIREMENT_PASSED' /tmp/godot-t015-retirement.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-t015-retirement.log; then ci_fail_marker 'Forbidden error marker'; fi
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/links_smoke.gd 2>&1 | tee /tmp/godot-t015-links.log
          grep -q 'ATLAS_LINKS_PASSED' /tmp/godot-t015-links.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-t015-links.log; then ci_fail_marker 'Forbidden error marker'; fi
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/linked_maps_ui_smoke.gd 2>&1 | tee /tmp/godot-t015-link-ui.log
          grep -q 'ATLAS_LINKED_MAPS_UI_PASSED' /tmp/godot-t015-link-ui.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-t015-link-ui.log; then ci_fail_marker 'Forbidden error marker'; fi
          # Active archival-boundary and modern navigation witnesses: former
          # spatial placement previews are deliberately not an authoring surface.
          for witness in \
              't015_archived_geometry_smoke.gd:ATLAS_T015_ARCHIVE_PASSED' \
              'overview_smoke.gd:ATLAS_OVERVIEW_PASSED' \
              'layer_hierarchy_smoke.gd:ATLAS_LAYER_HIERARCHY_PASSED' \
              'search_stale_actions_smoke.gd:ATLAS_SEARCH_STALE_PASSED' \
              'organization_ui_smoke.gd:ATLAS_ORGANIZATION_UI_PASSED' \
              'references_ui_smoke.gd:ATLAS_REFERENCES_UI_PASSED'; do
            file="${witness%%:*}"
            marker="${witness#*:}"
            log="/tmp/godot-t015-${file%.gd}.log"
            timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script "res://tests/$file" 2>&1 | tee "$log"
            grep -q "$marker" "$log"
            if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' "$log"; then ci_fail_marker 'Forbidden error marker'; fi
          done
          ci_finish
      - name: Verify T-054 Drawing/Atlas chronological history
        id: ci_09_verify_t_054_drawing_atlas_chronological_history
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          source tools/ci_fail_late.sh
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/drawing_history_smoke.gd 2>&1 | tee /tmp/godot-drawing-history.log
          grep -q 'DRAWING_HISTORY_PASSED' /tmp/godot-drawing-history.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|failed;' /tmp/godot-drawing-history.log; then ci_fail_marker 'Forbidden error marker'; fi
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/drawing_history_editor_smoke.gd 2>&1 | tee /tmp/godot-drawing-history-editor.log
          grep -q 'DRAWING_HISTORY_EDITOR_PASSED' /tmp/godot-drawing-history-editor.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-drawing-history-editor.log; then ci_fail_marker 'Forbidden error marker'; fi
          ci_finish
      - name: Verify T-058 editable text, font integrity and undoable rasterization
        id: ci_10_verify_t_058_editable_text_font_integrity_and_undoable_rasteriz
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          source tools/ci_fail_late.sh
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/drawing_text_smoke.gd 2>&1 | tee /tmp/godot-drawing-text.log
          grep -q 'DRAWING_TEXT_PASSED' /tmp/godot-drawing-text.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-drawing-text.log; then ci_fail_marker 'Forbidden error marker'; fi
          python3 tools/build_drawing_app.py --in-place
          # Staging refreshes font files: let Godot generate their imported FontFile resources.
          godot --headless --editor --path drawing --import --quit
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/text_editor_smoke.gd 2>&1 | tee /tmp/godot-drawing-text-ui.log
          grep -q 'DRAWING_TEXT_UI_PASSED' /tmp/godot-drawing-text-ui.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-drawing-text-ui.log; then ci_fail_marker 'Forbidden error marker'; fi
          ci_finish
      - name: Verify T-060 reusable Object Assets and atomic Save As
        id: ci_11_verify_t_060_reusable_object_assets_and_atomic_save_as
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/object_assets_smoke.gd 2>&1 | tee /tmp/godot-object-assets.log
          grep -q 'OBJECT_ASSETS_PASSED' /tmp/godot-object-assets.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|OBJECT_ASSETS_FAILED:' /tmp/godot-object-assets.log; then exit 1; fi
      - name: Verify T-064 nested Object child graph, safe saves and cycle rejection
        id: ci_11b_verify_t_064_nested_object_graph
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/object_child_graph_smoke.gd 2>&1 | tee /tmp/godot-t064-child-graph.log
          grep -q 'T064_CHILD_GRAPH_PASSED' /tmp/godot-t064-child-graph.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T064_CHILD_GRAPH_FAILED:' /tmp/godot-t064-child-graph.log; then exit 1; fi
      - name: Verify T-064 atomic nested Objects project copying
        id: ci_t064_nested_project_copy
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/object_nested_project_copy_smoke.gd 2>&1 | tee /tmp/godot-t064-project-copy.log
          grep -q 'T064_PROJECT_COPY_PASSED' /tmp/godot-t064-project-copy.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T064_PROJECT_COPY_FAILED:' /tmp/godot-t064-project-copy.log; then exit 1; fi
          # A saved portable campaign copy includes all retained Drawing/Objects/
          # Fonts generations, verified before one destination directory rename.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/object_nested_campaign_copy_smoke.gd 2>&1 | tee /tmp/godot-t064-campaign-copy.log
          grep -q 'T064_CAMPAIGN_COPY_PASSED' /tmp/godot-t064-campaign-copy.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T064_CAMPAIGN_COPY_FAILED:' /tmp/godot-t064-campaign-copy.log; then exit 1; fi
          # Atlas File > Copy saved campaign routes through the same verified API.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/object_nested_campaign_copy_ui_smoke.gd 2>&1 | tee /tmp/godot-t064-copy-ui.log
          grep -q 'T064_COPY_UI_PASSED' /tmp/godot-t064-copy-ui.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T064_COPY_UI_FAILED:' /tmp/godot-t064-copy-ui.log; then exit 1; fi
      - name: Verify T-064 bounded nested source composition and hit paths
        id: ci_t064_nested_source_render
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/object_child_render_smoke.gd 2>&1 | tee /tmp/godot-t064-child-render.log
          grep -q 'T064_CHILD_RENDER_PASSED' /tmp/godot-t064-child-render.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T064_RENDER_FAILED:' /tmp/godot-t064-child-render.log; then exit 1; fi
      - name: Verify T-064 parent-scoped nested child transforms and history
        id: ci_t064_nested_child_edit
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/object_child_edit_smoke.gd 2>&1 | tee /tmp/godot-t064-child-edit.log
          grep -q 'T064_CHILD_EDIT_PASSED' /tmp/godot-t064-child-edit.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T064_CHILD_EDIT_FAILED:' /tmp/godot-t064-child-edit.log; then exit 1; fi
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/object_child_structure_smoke.gd 2>&1 | tee /tmp/godot-t064-child-structure.log
          grep -q 'T064_CHILD_STRUCTURE_PASSED' /tmp/godot-t064-child-structure.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T064_CHILD_STRUCTURE_FAILED:' /tmp/godot-t064-child-structure.log; then exit 1; fi
          # Repair retained NULL children through the same optimistic graph
          # boundary and reversible parent-scoped history (no owner UX gate).
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/object_child_null_repair_smoke.gd 2>&1 | tee /tmp/godot-t064-child-null-repair.log
          grep -q 'T064_CHILD_REPAIR_PASSED' /tmp/godot-t064-child-null-repair.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T064_CHILD_REPAIR_FAILED:' /tmp/godot-t064-child-null-repair.log; then exit 1; fi
          # T-064 child visibility is a reversible, parent-scoped graph edit;
          # hidden descendants are excluded from rendering and pointer hits.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/object_child_visibility_smoke.gd 2>&1 | tee /tmp/godot-t064-child-visibility.log
          grep -q 'T064_CHILD_VISIBILITY_PASSED' /tmp/godot-t064-child-visibility.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T064_CHILD_VISIBILITY_FAILED:' /tmp/godot-t064-child-visibility.log; then exit 1; fi
          # Alt+click must resolve the correct nested parent through the live
          # Atlas canvas, without resetting child-local history or map context.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/object_child_canvas_select_smoke.gd 2>&1 | tee /tmp/godot-t064-child-canvas.log
          grep -q 'T064_CANVAS_CHILD_PASSED' /tmp/godot-t064-child-canvas.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T064_CANVAS_CHILD_FAILED:' /tmp/godot-t064-child-canvas.log; then exit 1; fi
          # Alt+drag moves a published child only on release; all cancellation,
          # stale-index and nested ancestor-coordinate cases are checked here.
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/object_child_canvas_drag_smoke.gd 2>&1 | tee /tmp/godot-t064-child-drag.log
          grep -q 'T064_CANVAS_DRAG_PASSED' /tmp/godot-t064-child-drag.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T064_CANVAS_DRAG_FAILED:' /tmp/godot-t064-child-drag.log; then exit 1; fi
      - name: Verify T-062 Object Editor source publishing, bound origin and saved variants
        id: ci_12_verify_t_062_object_editor_source_publishing_bound_origin_and_s
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          source tools/ci_fail_late.sh
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/object_editor_smoke.gd 2>&1 | tee /tmp/godot-object-editor.log
          grep -q 'OBJECT_EDITOR_PASSED' /tmp/godot-object-editor.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|OBJECT_EDITOR_FAILED:' /tmp/godot-object-editor.log; then ci_fail_marker 'Forbidden error marker'; fi
          python3 tools/build_drawing_app.py --in-place
          # Staged licensed fonts must be imported before UI text editing.
          godot --headless --editor --path drawing --import --quit
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path drawing --script res://tests/object_editor_ui_smoke.gd 2>&1 | tee /tmp/godot-object-editor-ui.log
          grep -q 'DRAWING_OBJECT_UI_PASSED' /tmp/godot-object-editor-ui.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|DRAWING_OBJECT_UI_FAILED:' /tmp/godot-object-editor-ui.log; then ci_fail_marker 'Forbidden error marker'; fi
          ci_finish
      - name: Verify T-061 signed floor/detail world mapping and blank D-levels
        id: ci_13_verify_t_061_signed_floor_detail_world_mapping_and_blank_d_leve
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/drawing_world_mapping_smoke.gd 2>&1 | tee /tmp/godot-world-mapping.log
          grep -q 'T061_WORLD_MAPPING_PASSED' /tmp/godot-world-mapping.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T061_FAILED:' /tmp/godot-world-mapping.log; then exit 1; fi
      - name: Verify T-055 Atlas canonical Drawing composition and input
        id: ci_14_verify_t_055_atlas_canonical_drawing_composition_and_input
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/drawing_composition_smoke.gd 2>&1 | tee /tmp/godot-t055-composition.log
          grep -q 'T055_COMPOSITION_PASSED' /tmp/godot-t055-composition.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T055_FAILED:' /tmp/godot-t055-composition.log; then exit 1; fi
      - name: Verify T-068 hard-dab parity and source-tile cache transactions
        id: ci_t068_stationary_dab_parity
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/drawing_dab_geometry_smoke.gd 2>&1 | tee /tmp/godot-t068-dab.log
          grep -q 'T068_DAB_PASSED' /tmp/godot-t068-dab.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T068_DAB_FAILED:' /tmp/godot-t068-dab.log; then exit 1; fi
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/drawing_edit_tile_cache_smoke.gd 2>&1 | tee /tmp/godot-t068-tile-cache.log
          grep -q 'T068_TILE_CACHE_PASSED' /tmp/godot-t068-tile-cache.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T068_TILE_CACHE_FAILED:' /tmp/godot-t068-tile-cache.log; then exit 1; fi
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/drawing_publication_tile_cache_smoke.gd 2>&1 | tee /tmp/godot-t068-publication.log
          grep -q 'T068_PUBLICATION_PASSED' /tmp/godot-t068-publication.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T068_PUBLICATION_FAILED:' /tmp/godot-t068-publication.log; then exit 1; fi
      - name: Verify T-066 atomic sparse campaign generations, recovery and editor Save/Load
        id: ci_15_verify_t_066_atomic_sparse_campaign_generations_recovery_and_ed
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          source tools/ci_fail_late.sh
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/campaign_bundle_smoke.gd 2>&1 | tee /tmp/godot-t066-bundle.log
          grep -q 'ATLAS_BUNDLE_PASSED' /tmp/godot-t066-bundle.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T066_FAILED:|ATLAS_BUNDLE_FAILED' /tmp/godot-t066-bundle.log; then ci_fail_marker 'Forbidden error marker'; fi
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/campaign_bundle_editor_smoke.gd 2>&1 | tee /tmp/godot-t066-editor.log
          grep -q 'ATLAS_BUNDLE_EDITOR_PASSED' /tmp/godot-t066-editor.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T066_EDITOR_FAILED:|ATLAS_BUNDLE_EDITOR_FAILED' /tmp/godot-t066-editor.log; then ci_fail_marker 'Forbidden error marker'; fi
          ci_finish
      - name: Verify T-073 approved inventory versus proposed workspace UX
        id: ci_21_verify_t_073_approved_inventory_versus_proposed_workspace_ux
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_t073_feature_ux_docs.py' -v
      - name: Verify T-063 compact Drawing workspace and shortcut contract
        id: ci_22_verify_t_063_compact_drawing_workspace_and_shortcut_contract
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_t063_workspace_docs.py' -v
      - name: Verify T-078 reusable grouped dock layout model
        id: ci_dock_layout_model
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://drawing/tests/dock_layout_smoke.gd 2>&1 | tee /tmp/godot-dock-layout.log
          grep -q 'DRAWING_DOCK_MODEL_PASSED' /tmp/godot-dock-layout.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|DOCK MODEL FAILED:' /tmp/godot-dock-layout.log; then exit 1; fi
      - name: Verify T-080 transactional dock drag/drop model
        id: ci_dock_drag_model
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://drawing/tests/dock_drag_smoke.gd 2>&1 | tee /tmp/godot-dock-drag.log
          grep -q 'T080_DOCK_DRAG_MODEL_PASSED' /tmp/godot-dock-drag.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T080_MODEL_FAILED:' /tmp/godot-dock-drag.log; then exit 1; fi
      - name: Verify T-081 floating host ownership and transaction model
        id: ci_dock_floating_model
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://drawing/tests/dock_float_smoke.gd 2>&1 | tee /tmp/godot-dock-float.log
          grep -q 'T081_FLOAT_MODEL_PASSED' /tmp/godot-dock-float.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T081_MODEL_FAILED:' /tmp/godot-dock-float.log; then exit 1; fi
      - name: Verify T-082 cross-container docking transaction model
        id: ci_dock_cross_model
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
