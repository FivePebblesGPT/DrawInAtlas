name: Godot GDScript checks

on:
  push:
  pull_request:

jobs:
  smoke-and-web-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Godot cannot import LFS pointer text as textures.
          lfs: true
      - name: Install Godot 4.8-beta2 (standard, non-.NET)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta2
          use-dotnet: false
          include-templates: true
      - name: Verify the exact beta engine
        shell: bash
        run: godot --version | grep -E '^4\.8\.beta2\.official\.'
      - name: Enforce explicit types in owned GDScript and skill examples
        run: python3 tests/check_explicit_types.py
      - name: Import resources and parse scripts
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:|Compile Error:' /tmp/godot-import.log; then exit 1; fi
      - name: Run domain smoke tests
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/smoke.gd 2>&1 | tee /tmp/godot-test.log
          grep -q 'ATLAS_TESTS_PASSED' /tmp/godot-test.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-test.log; then exit 1; fi
      - name: Run artwork and history tests
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/artwork_smoke.gd 2>&1 | tee /tmp/godot-artwork.log
          grep -q 'ATLAS_ARTWORK_PASSED' /tmp/godot-artwork.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-artwork.log; then exit 1; fi
      - name: Run board and grid tests
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/board_grid_smoke.gd 2>&1 | tee /tmp/godot-board-grid.log
          grep -q 'ATLAS_BOARD_GRID_PASSED' /tmp/godot-board-grid.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-board-grid.log; then exit 1; fi
      - name: Run continuous shared-canvas regression (T-002)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/continuous_canvas_smoke.gd 2>&1 | tee /tmp/godot-continuous-canvas.log
          grep -q 'ATLAS_CONTINUOUS_CANVAS_PASSED' /tmp/godot-continuous-canvas.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|^FAIL:' /tmp/godot-continuous-canvas.log; then exit 1; fi
      - name: Verify viewport zoom and authored LOD contract (T-004)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/zoom_lod_contract_smoke.gd 2>&1 | tee /tmp/godot-zoom-lod.log
          grep -q 'ATLAS_ZOOM_LOD_CONTRACT_PASSED' /tmp/godot-zoom-lod.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|^FAIL:' /tmp/godot-zoom-lod.log; then exit 1; fi
      - name: Verify aligned transparent detail previews (T-003)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/aligned_detail_previews_smoke.gd 2>&1 | tee /tmp/godot-aligned-detail-previews.log
          grep -q 'ATLAS_ALIGNED_DETAIL_PREVIEWS_PASSED' /tmp/godot-aligned-detail-previews.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|^FAIL:' /tmp/godot-aligned-detail-previews.log; then exit 1; fi
      - name: Verify automatic authored artwork LOD (T-005)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/automatic_artwork_lod_smoke.gd 2>&1 | tee /tmp/godot-automatic-lod.log
          grep -q 'ATLAS_AUTOMATIC_ARTWORK_LOD_PASSED' /tmp/godot-automatic-lod.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|^FAIL:' /tmp/godot-automatic-lod.log; then exit 1; fi
      - name: Run layer and recovery tests
        shell: bash
        run: |
          set -euo pipefail
          for suite in layers_smoke storage_smoke layer_ui_smoke; do
            godot --headless --path . --script "res://tests/$suite.gd" 2>&1 | tee "/tmp/godot-$suite.log"
            if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' "/tmp/godot-$suite.log"; then exit 1; fi
          done
          grep -q 'ATLAS_LAYERS_PASSED' /tmp/godot-layers_smoke.log
          grep -q 'ATLAS_STORAGE_PASSED' /tmp/godot-storage_smoke.log
          grep -q 'ATLAS_LAYER_UI_PASSED' /tmp/godot-layer_ui_smoke.log
      - name: Verify categorized sidebar tool palette (T-006)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/tool_palette_smoke.gd 2>&1 | tee /tmp/godot-tool-palette.log
          grep -q 'ATLAS_TOOL_PALETTE_PASSED' /tmp/godot-tool-palette.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-tool-palette.log; then exit 1; fi
      - name: Verify compact action controls (T-007)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/compact_controls_smoke.gd 2>&1 | tee /tmp/godot-compact-controls.log
          grep -q 'ATLAS_COMPACT_CONTROLS_PASSED' /tmp/godot-compact-controls.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-compact-controls.log; then exit 1; fi
      - name: Verify compact authored-detail and link hierarchy (T-018 preview)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/layer_hierarchy_smoke.gd 2>&1 | tee /tmp/godot-layer-hierarchy.log
          grep -q 'ATLAS_LAYER_HIERARCHY_PASSED' /tmp/godot-layer-hierarchy.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|HIERARCHY FAILED:' /tmp/godot-layer-hierarchy.log; then exit 1; fi
      - name: Verify grid settings toolbar popup (T-008)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/grid_settings_smoke.gd 2>&1 | tee /tmp/godot-grid-settings.log
          grep -q 'ATLAS_GRID_SETTINGS_PASSED' /tmp/godot-grid-settings.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-grid-settings.log; then exit 1; fi
      - name: Verify round pen turns (T-010)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/pen_turns_smoke.gd 2>&1 | tee /tmp/godot-pen-turns.log
          grep -q 'ATLAS_PEN_TURNS_PASSED' /tmp/godot-pen-turns.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-pen-turns.log; then exit 1; fi
      - name: Verify local detail authoring without battlemat documents (T-012)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/local_detail_workflow_smoke.gd 2>&1 | tee /tmp/godot-local-detail.log
          grep -q 'ATLAS_LOCAL_DETAIL_WORKFLOW_PASSED' /tmp/godot-local-detail.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|^FAIL:' /tmp/godot-local-detail.log; then exit 1; fi
      - name: Verify retired battlemat creation paths (T-014)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/retired_battlemap_controls_smoke.gd 2>&1 | tee /tmp/godot-retired-battlemap.log
          grep -q 'ATLAS_RETIRED_BATTLEMAP_PASSED' /tmp/godot-retired-battlemap.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|^FAIL:' /tmp/godot-retired-battlemap.log; then exit 1; fi
      - name: Inventory legacy placement migrations without modifying saves (T-015)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/legacy_migration_audit_smoke.gd 2>&1 | tee /tmp/godot-legacy-migration-audit.log
          grep -q 'ATLAS_LEGACY_MIGRATION_AUDIT_PASSED' /tmp/godot-legacy-migration-audit.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|^FAIL:' /tmp/godot-legacy-migration-audit.log; then exit 1; fi
      - name: Verify Brush tool opacity, stroke and raster behavior (T-020)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/brush_smoke.gd 2>&1 | tee /tmp/godot-brush.log
          grep -q 'ATLAS_BRUSH_PASSED' /tmp/godot-brush.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|^BRUSH FAILED:' /tmp/godot-brush.log; then exit 1; fi
      - name: Verify Eraser geometry, alpha, masks and saving (T-021)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/eraser_smoke.gd 2>&1 | tee /tmp/godot-eraser.log
          grep -q 'ATLAS_ERASER_PASSED' /tmp/godot-eraser.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|^ERASER FAILED:' /tmp/godot-eraser.log; then exit 1; fi
      - name: Verify Bucket tolerance, bounds, previews and saving (T-023)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/bucket_smoke.gd 2>&1 | tee /tmp/godot-bucket.log
          grep -q 'ATLAS_BUCKET_PASSED' /tmp/godot-bucket.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|^BUCKET FAILED:' /tmp/godot-bucket.log; then exit 1; fi
      - name: Verify active-layer Move gestures (T-022)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/move_smoke.gd 2>&1 | tee /tmp/godot-move.log
          grep -q 'ATLAS_MOVE_PASSED' /tmp/godot-move.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|^MOVE FAILED:' /tmp/godot-move.log; then exit 1; fi
      - name: Verify mouse-wheel brush width (T-011)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/pen_width_wheel_smoke.gd 2>&1 | tee /tmp/godot-pen-width-wheel.log
          grep -q 'ATLAS_PEN_WIDTH_WHEEL_PASSED' /tmp/godot-pen-width-wheel.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-pen-width-wheel.log; then exit 1; fi
      - name: Run editing tool and clipboard tests
        shell: bash
        run: |
          set -euo pipefail
          for suite in fill_scope_smoke clipboard_smoke selection_smoke tools_ui_smoke; do
            godot --headless --path . --script "res://tests/$suite.gd" 2>&1 | tee "/tmp/godot-$suite.log"
            if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' "/tmp/godot-$suite.log"; then exit 1; fi
          done
          grep -q 'ATLAS_FILL_SCOPE_PASSED' /tmp/godot-fill_scope_smoke.log
          grep -q 'ATLAS_CLIPBOARD_PASSED' /tmp/godot-clipboard_smoke.log
          grep -q 'ATLAS_SELECTION_PASSED' /tmp/godot-selection_smoke.log
          grep -q 'ATLAS_TOOLS_UI_PASSED' /tmp/godot-tools_ui_smoke.log
      - name: Verify active-layer selection gestures and masks (T-019)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/selection_interactions_smoke.gd 2>&1 | tee /tmp/godot-selection-interactions.log
          grep -q 'ATLAS_SELECTION_INTERACTIONS_PASSED' /tmp/godot-selection-interactions.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-selection-interactions.log; then exit 1; fi
      - name: Verify coherent grid snapping and edit masks (T-016)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/snapping_smoke.gd 2>&1 | tee /tmp/godot-snapping.log
          grep -q 'ATLAS_SNAPPING_PASSED' /tmp/godot-snapping.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-snapping.log; then exit 1; fi
      - name: Run workspace composition and organization tests
        shell: bash
        run: |
          set -euo pipefail
          for suite in editor_modules_smoke organization_ui_smoke floors_view_smoke overview_smoke preview_cache_smoke; do
            godot --headless --path . --script "res://tests/$suite.gd" 2>&1 | tee "/tmp/godot-$suite.log"
            if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' "/tmp/godot-$suite.log"; then exit 1; fi
          done
          grep -q 'ATLAS_EDITOR_MODULES_PASSED' /tmp/godot-editor_modules_smoke.log
          grep -q 'ATLAS_ORGANIZATION_UI_PASSED' /tmp/godot-organization_ui_smoke.log
          grep -q 'ATLAS_FLOORS_VIEW_PASSED' /tmp/godot-floors_view_smoke.log
          grep -q 'ATLAS_OVERVIEW_PASSED' /tmp/godot-overview_smoke.log
          grep -q 'ATLAS_PREVIEW_CACHE_PASSED' /tmp/godot-preview_cache_smoke.log
      # Linked-map commands/UI run headlessly as well as through native input.
      - name: Run linked-map workflow tests
        shell: bash
        run: |
          set -euo pipefail
          for suite in links_smoke linked_maps_ui_smoke; do
            godot --headless --path . --script "res://tests/$suite.gd" 2>&1 | tee "/tmp/godot-$suite.log"
            if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' "/tmp/godot-$suite.log"; then exit 1; fi
          done
          grep -q 'ATLAS_LINKS_PASSED' /tmp/godot-links_smoke.log
          grep -q 'ATLAS_LINKED_MAPS_UI_PASSED' /tmp/godot-linked_maps_ui_smoke.log
      - name: Install native framebuffer test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Run native framebuffer acceptance
        timeout-minutes: 5
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          for suite in visual_smoke continuous_canvas_visual zoom_lod_contract_visual aligned_detail_previews_visual automatic_artwork_lod_visual tool_palette_visual compact_controls_visual grid_settings_visual brush_visual eraser_visual move_visual bucket_visual pen_turns_visual pen_width_wheel_visual selection_interactions_visual snapping_visual layer_hierarchy_visual preview_ui_smoke linked_maps_ui_smoke references_ui_smoke; do
            xvfb-run -a godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path . --script "res://tests/$suite.gd" 2>&1 | tee "/tmp/godot-$suite.log"
            if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' "/tmp/godot-$suite.log"; then exit 1; fi
          done
          grep -q 'ATLAS_VISUAL_PASSED' /tmp/godot-visual_smoke.log
          grep -q 'ATLAS_CONTINUOUS_CANVAS_VISUAL_PASSED' /tmp/godot-continuous_canvas_visual.log
          grep -q 'ATLAS_ZOOM_LOD_VISUAL_PASSED' /tmp/godot-zoom_lod_contract_visual.log
          grep -q 'ATLAS_ALIGNED_DETAIL_PREVIEWS_VISUAL_PASSED' /tmp/godot-aligned_detail_previews_visual.log
          grep -q 'ATLAS_AUTOMATIC_ARTWORK_LOD_VISUAL_PASSED' /tmp/godot-automatic_artwork_lod_visual.log
          grep -q 'ATLAS_TOOL_PALETTE_VISUAL_PASSED' /tmp/godot-tool_palette_visual.log
          grep -q 'ATLAS_COMPACT_CONTROLS_VISUAL_PASSED' /tmp/godot-compact_controls_visual.log
          grep -q 'ATLAS_GRID_SETTINGS_VISUAL_PASSED' /tmp/godot-grid_settings_visual.log
          grep -q 'ATLAS_BRUSH_VISUAL_PASSED' /tmp/godot-brush_visual.log
          grep -q 'ATLAS_ERASER_VISUAL_PASSED' /tmp/godot-eraser_visual.log
          grep -q 'ATLAS_MOVE_VISUAL_PASSED' /tmp/godot-move_visual.log
          grep -q 'ATLAS_BUCKET_VISUAL_PASSED' /tmp/godot-bucket_visual.log
          grep -q 'ATLAS_PEN_TURNS_VISUAL_PASSED' /tmp/godot-pen_turns_visual.log
          grep -q 'ATLAS_PEN_WIDTH_WHEEL_VISUAL_PASSED' /tmp/godot-pen_width_wheel_visual.log
          grep -q 'ATLAS_SELECTION_INTERACTIONS_VISUAL_PASSED' /tmp/godot-selection_interactions_visual.log
          grep -q 'ATLAS_SNAPPING_VISUAL_PASSED' /tmp/godot-snapping_visual.log
          grep -q 'ATLAS_LAYER_HIERARCHY_VISUAL_PASSED' /tmp/godot-layer_hierarchy_visual.log
          grep -q 'ATLAS_PREVIEW_UI_PASSED' /tmp/godot-preview_ui_smoke.log
          grep -q 'ATLAS_LINKED_MAPS_UI_PASSED' /tmp/godot-linked_maps_ui_smoke.log
          grep -q 'ATLAS_REFERENCES_UI_PASSED' /tmp/godot-references_ui_smoke.log
      - name: Launch main scene headlessly
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee /tmp/godot-launch.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:|Compile Error:' /tmp/godot-launch.log; then exit 1; fi
      - name: Export Web (single-thread, Compatibility)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tee /tmp/godot-export.log
          test -s build/web/index.html
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:|Compile Error:' /tmp/godot-export.log; then exit 1; fi
      - name: Verify fresh-process saves across exported script remaps
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/storage_smoke.gd -- write-portable /tmp/atlas-source.scn 2>&1 | tee /tmp/atlas-source-write.log
          godot --headless --main-pack build/web/index.pck --script "$GITHUB_WORKSPACE/tests/storage_smoke.gd" -- read-portable /tmp/atlas-source.scn 2>&1 | tee /tmp/atlas-pack-read.log
          godot --headless --main-pack build/web/index.pck --script "$GITHUB_WORKSPACE/tests/storage_smoke.gd" -- write-portable /tmp/atlas-packed.scn 2>&1 | tee /tmp/atlas-pack-write.log
          godot --headless --path . --script res://tests/storage_smoke.gd -- read-portable /tmp/atlas-packed.scn 2>&1 | tee /tmp/atlas-source-read.log
          for log in /tmp/atlas-source-write.log /tmp/atlas-pack-read.log /tmp/atlas-pack-write.log /tmp/atlas-source-read.log; do
            grep -q 'ATLAS_PORTABILITY_PASSED' "$log"
            if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' "$log"; then exit 1; fi
          done
      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: drawinatlas-web
          path: build/web/
