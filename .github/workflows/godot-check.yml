name: Godot GDScript checks

on:
  push:
  pull_request:

jobs:
  smoke-and-web-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Godot cannot import LFS pointer text as textures.
          lfs: true
      - name: Install Godot 4.8-beta2 (standard, non-.NET)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta2
          use-dotnet: false
          include-templates: true
      - name: Verify the exact beta engine
        shell: bash
        run: godot --version | grep -E '^4\.8\.beta2\.official\.'
      - name: Enforce explicit types in owned GDScript and skill examples
        run: python3 tests/check_explicit_types.py
      - name: Verify T-051 isolated Drawing contract consumer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_drawing_contract.py' -v
      - name: Verify T-052 extracted independent Drawing core
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_drawing_core.py' -v
      - name: Verify T-053 isolated standalone Drawing and third package consumer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_drawing_app.py' -v
      - name: Verify T-053 standalone Linux release package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/drawing-dist
          python3 tools/build_drawing_app.py --output /tmp/drawing-dist/project
          godot --headless --editor --path /tmp/drawing-dist/project --import --quit
          godot --headless --path /tmp/drawing-dist/project --export-release Linux /tmp/drawing-dist/Drawing.x86_64
          test -s /tmp/drawing-dist/Drawing.x86_64
          test -s /tmp/drawing-dist/Drawing.pck
          # Godot keeps font bytes inside imported .fontdata, not raw .ttf paths.
          # Run a source-side probe against the exported PCK (never the editor tree).
          godot --headless --path /tmp/drawing-dist --main-pack /tmp/drawing-dist/Drawing.pck \
            --script /tmp/drawing-dist/project/tests/packaged_fonts_smoke.gd \
            2>&1 | tee /tmp/godot-export-fonts.log
          grep -q 'DRAWING_PACK_FONT_PASSED' /tmp/godot-export-fonts.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-export-fonts.log; then exit 1; fi
      - name: Verify T-054 Drawing/Atlas chronological history
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/drawing_history_smoke.gd 2>&1 | tee /tmp/godot-drawing-history.log
          grep -q 'DRAWING_HISTORY_PASSED' /tmp/godot-drawing-history.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|failed;' /tmp/godot-drawing-history.log; then exit 1; fi
          godot --headless --path . --script res://tests/drawing_history_editor_smoke.gd 2>&1 | tee /tmp/godot-drawing-history-editor.log
          grep -q 'DRAWING_HISTORY_EDITOR_PASSED' /tmp/godot-drawing-history-editor.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-drawing-history-editor.log; then exit 1; fi
      - name: Import resources and parse scripts
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:|Compile Error:' /tmp/godot-import.log; then exit 1; fi
      - name: Verify T-058 editable text, font integrity and undoable rasterization
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/drawing_text_smoke.gd 2>&1 | tee /tmp/godot-drawing-text.log
          grep -q 'DRAWING_TEXT_PASSED' /tmp/godot-drawing-text.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-drawing-text.log; then exit 1; fi
          python3 tools/build_drawing_app.py --in-place
          # Staging refreshes font files: let Godot generate their imported FontFile resources.
          godot --headless --editor --path drawing --import --quit
          godot --headless --path drawing --script res://tests/text_editor_smoke.gd 2>&1 | tee /tmp/godot-drawing-text-ui.log
          grep -q 'DRAWING_TEXT_UI_PASSED' /tmp/godot-drawing-text-ui.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-drawing-text-ui.log; then exit 1; fi
      - name: Verify T-060 reusable Object Assets and atomic Save As
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/object_assets_smoke.gd 2>&1 | tee /tmp/godot-object-assets.log
          grep -q 'OBJECT_ASSETS_PASSED' /tmp/godot-object-assets.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|OBJECT_ASSETS_FAILED:' /tmp/godot-object-assets.log; then exit 1; fi
      - name: Verify T-062 Object Editor source publishing, bound origin and saved variants
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/object_editor_smoke.gd 2>&1 | tee /tmp/godot-object-editor.log
          grep -q 'OBJECT_EDITOR_PASSED' /tmp/godot-object-editor.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|OBJECT_EDITOR_FAILED:' /tmp/godot-object-editor.log; then exit 1; fi
          python3 tools/build_drawing_app.py --in-place
          # Staged licensed fonts must be imported before UI text editing.
          godot --headless --editor --path drawing --import --quit
          godot --headless --path drawing --script res://tests/object_editor_ui_smoke.gd 2>&1 | tee /tmp/godot-object-editor-ui.log
          grep -q 'DRAWING_OBJECT_UI_PASSED' /tmp/godot-object-editor-ui.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|DRAWING_OBJECT_UI_FAILED:' /tmp/godot-object-editor-ui.log; then exit 1; fi
      - name: Verify T-061 signed floor/detail world mapping and blank D-levels
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/drawing_world_mapping_smoke.gd 2>&1 | tee /tmp/godot-world-mapping.log
          grep -q 'T061_WORLD_MAPPING_PASSED' /tmp/godot-world-mapping.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T061_FAILED:' /tmp/godot-world-mapping.log; then exit 1; fi
      - name: Verify T-055 Atlas canonical Drawing composition and input
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/drawing_composition_smoke.gd 2>&1 | tee /tmp/godot-t055-composition.log
          grep -q 'T055_COMPOSITION_PASSED' /tmp/godot-t055-composition.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T055_FAILED:' /tmp/godot-t055-composition.log; then exit 1; fi
      - name: Verify T-066 atomic sparse campaign generations, recovery and editor Save/Load
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/campaign_bundle_smoke.gd 2>&1 | tee /tmp/godot-t066-bundle.log
          grep -q 'ATLAS_BUNDLE_PASSED' /tmp/godot-t066-bundle.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T066_FAILED:|ATLAS_BUNDLE_FAILED' /tmp/godot-t066-bundle.log; then exit 1; fi
          godot --headless --path . --script res://tests/campaign_bundle_editor_smoke.gd 2>&1 | tee /tmp/godot-t066-editor.log
          grep -q 'ATLAS_BUNDLE_EDITOR_PASSED' /tmp/godot-t066-editor.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T066_EDITOR_FAILED:|ATLAS_BUNDLE_EDITOR_FAILED' /tmp/godot-t066-editor.log; then exit 1; fi
      - name: Verify T-067 measured chunk geometry and Zstd parity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_chunk_geometry.py' -v
          python3 tools/benchmarks/chunk_geometry.py --output /tmp/t067-ci --repeats 1 \
            2>&1 | tee /tmp/t067-layouts.log
          grep -q 'T067_GEOMETRY_PASSED (16 workload/stride cases, 48 layout cases)' /tmp/t067-layouts.log
          godot --headless --path . --script res://tests/chunk_geometry_codec_smoke.gd -- \
            --folder /tmp/t067-ci 2>&1 | tee /tmp/t067-codec.log
          grep -q 'T067_CODEC_PASSED' /tmp/t067-codec.log
          godot --headless --path . --script res://tests/chunk_geometry_benchmark.gd -- \
            --output /tmp/t067-ci/native.json 2>&1 | tee /tmp/t067-native.log
          grep -q 'T067_NATIVE_PASSED (386 checks, 0 failures)' /tmp/t067-native.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T067_FAILED:|T067_CODEC_FAILED' \
            /tmp/t067-codec.log /tmp/t067-native.log; then exit 1; fi
      - name: Verify T-069 approved architecture and typed model documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_t069_architecture_docs.py' -v
      - name: Verify T-070 world, authored-detail and navigation documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_t070_world_docs.py' -v
      - name: Verify T-071 sparse campaign persistence and recovery documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_t071_storage_docs.py' -v
      - name: Verify T-072 current tools versus historical workflow documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_t072_tools_docs.py' -v
      - name: Verify T-073 approved inventory versus proposed workspace UX
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_t073_feature_ux_docs.py' -v
      - name: Verify T-077 performance and reviewer handoff documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_t077_handoff.py' -v
      - name: Verify T-068 canonical tile-run renderer and native feasibility probe
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_t068_kernel.py' -v
          godot --headless --path . --script res://tests/drawing_raster_backend_benchmark.gd -- \
            --output /tmp/t068-godot.json 2>&1 | tee /tmp/t068-godot.log
          grep -q 'T068_GODOT_PASSED' /tmp/t068-godot.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T068_FAILED:' /tmp/t068-godot.log; then exit 1; fi
          python3 tools/benchmarks/t068_native.py --build-dir /tmp/t068-build \
            --godot-vectors /tmp/t068-godot.json --output /tmp/t068-native.json \
            2>&1 | tee /tmp/t068-native.log
          grep -q 'T068_NATIVE_GODOT_PARITY_PASSED' /tmp/t068-native.log
          grep -q 'T068_NATIVE_PASSED' /tmp/t068-native.log
      - name: Run domain smoke tests
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/smoke.gd 2>&1 | tee /tmp/godot-test.log
          grep -q 'ATLAS_TESTS_PASSED' /tmp/godot-test.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-test.log; then exit 1; fi
      - name: Run artwork and history tests
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/artwork_smoke.gd 2>&1 | tee /tmp/godot-artwork.log
          grep -q 'ATLAS_ARTWORK_PASSED' /tmp/godot-artwork.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-artwork.log; then exit 1; fi
      - name: Run board and grid tests
        shell: bash
        run: |
          set -euo pipefail
