        id: ci_t065_atlas_portable_registry
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/object_portable_registry_smoke.gd 2>&1 | tee /tmp/godot-t065-portable-registry.log
          grep -q 'T065_PORTABLE_PASSED' /tmp/godot-t065-portable-registry.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T065_PORTABLE_FAILED:' /tmp/godot-t065-portable-registry.log; then exit 1; fi
      - name: Verify T-065 shared Atlas Asset Browser and guarded linked drops
        id: ci_t065_atlas_browser_bridge
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/asset_browser_atlas_smoke.gd 2>&1 | tee /tmp/godot-t065-atlas-browser.log
          python3 tools/check_godot_model_log.py /tmp/godot-t065-atlas-browser.log --marker T065_ATLAS_BROWSER_PASSED
      - name: Verify T-065 large Atlas source catalog paging and global search
        id: ci_t065_atlas_browser_paging
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/asset_browser_atlas_paging_smoke.gd 2>&1 | tee /tmp/godot-t065-atlas-paging.log
          grep -q 'T065_PAGING_PASSED' /tmp/godot-t065-atlas-paging.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T065_PAGING_FAILED:' /tmp/godot-t065-atlas-paging.log; then exit 1; fi
      - name: Summarize CI failures
        if: ${{ !cancelled() }}
        env:
          GODOT_CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 tools/report_godot_ci.py
      - name: Export sanitized hosted CI evidence
        if: ${{ always() }}
        env:
          GODOT_CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 tools/export_godot_ci_evidence.py --output ci-evidence/godot-fast-ci.json
      - name: Upload hosted CI evidence (including red runs)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: godot-fast-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/godot-fast-ci.json
          if-no-files-found: error
          retention-days: 30
