          grep -q 'T055_COMPOSITION_PASSED' /tmp/godot-t055-composition.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T055_FAILED:' /tmp/godot-t055-composition.log; then exit 1; fi
      - name: Verify T-066 atomic sparse campaign generations, recovery and editor Save/Load
        id: ci_15_verify_t_066_atomic_sparse_campaign_generations_recovery_and_ed
        if: ${{ !cancelled() }}
        continue-on-error: true
