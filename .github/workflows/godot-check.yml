          grep -q 'T068_NATIVE_FRAME_PASSED checks=68 failures=0' /tmp/t068-frame.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T068_LATENCY_FAILED:' /tmp/t068-frame.log; then exit 1; fi
      - name: Verify T-053 native Drawing pointer and framebuffer
        id: ci_77_verify_t_053_native_drawing_pointer_and_framebuffer
