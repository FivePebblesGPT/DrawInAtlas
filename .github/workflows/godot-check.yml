          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:|HIERARCHY FAILED:' /tmp/godot-layer-hierarchy.log; then exit 1; fi
      - name: Verify grid settings toolbar popup (T-008)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/grid_settings_smoke.gd 2>&1 | tee /tmp/godot-grid-settings.log
          grep -q 'ATLAS_GRID_SETTINGS_PASSED' /tmp/godot-grid-settings.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-grid-settings.log; then exit 1; fi
      - name: Verify round pen turns (T-010)
