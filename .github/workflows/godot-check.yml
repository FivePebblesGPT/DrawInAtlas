        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          python3 tools/build_drawing_app.py --in-place
          timeout --signal=TERM --kill-after=5s 240s xvfb-run -a godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path drawing --script res://tests/native_text.gd 2>&1 | tee /tmp/drawing-native-text.log
          grep -q 'DRAWING_TEXT_NATIVE_PASSED' /tmp/drawing-native-text.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|DRAWING_TEXT_NATIVE_FAILED:' /tmp/drawing-native-text.log; then exit 1; fi
      - name: Verify editable text and screen-space culling (T-027)
        id: ci_81_verify_editable_text_and_screen_space_culling_t_027
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/text_smoke.gd 2>&1 | tee /tmp/godot-text.log
          grep -q 'ATLAS_TEXT_PASSED' /tmp/godot-text.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' /tmp/godot-text.log; then exit 1; fi
      - name: Run native framebuffer acceptance
        id: ci_82_run_native_framebuffer_acceptance
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          source tools/ci_fail_late.sh
          for suite in drawing_world_visual visual_smoke continuous_canvas_visual zoom_lod_contract_visual aligned_detail_previews_visual automatic_artwork_lod_visual tool_palette_visual compact_controls_visual grid_settings_visual brush_visual raster_rendering_visual drawing_performance_visual eraser_visual move_visual bucket_visual line_visual polygon_visual wall_paths_visual text_visual pen_turns_visual pen_width_wheel_visual selection_interactions_visual snapping_visual layer_hierarchy_visual preview_ui_smoke linked_maps_ui_smoke references_ui_smoke player_projection_visual projector_frame_visual player_output_session_visual token_visual fog_visual player_privacy_acceptance_visual player_web_fallback_visual collaboration_acceptance_visual; do
            timeout --signal=TERM --kill-after=5s 240s xvfb-run -a godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path . --script "res://tests/$suite.gd" 2>&1 | tee "/tmp/godot-$suite.log"
            if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' "/tmp/godot-$suite.log"; then ci_fail_marker 'Forbidden error marker'; fi
          done
          grep -q 'ATLAS_VISUAL_PASSED' /tmp/godot-visual_smoke.log
          grep -q 'ATLAS_CONTINUOUS_CANVAS_VISUAL_PASSED' /tmp/godot-continuous_canvas_visual.log
          grep -q 'ATLAS_ZOOM_LOD_VISUAL_PASSED' /tmp/godot-zoom_lod_contract_visual.log
          grep -q 'ATLAS_ALIGNED_DETAIL_PREVIEWS_VISUAL_PASSED' /tmp/godot-aligned_detail_previews_visual.log
          grep -q 'ATLAS_AUTOMATIC_ARTWORK_LOD_VISUAL_PASSED' /tmp/godot-automatic_artwork_lod_visual.log
          grep -q 'ATLAS_TOOL_PALETTE_VISUAL_PASSED' /tmp/godot-tool_palette_visual.log
          grep -q 'ATLAS_COMPACT_CONTROLS_VISUAL_PASSED' /tmp/godot-compact_controls_visual.log
          grep -q 'ATLAS_GRID_SETTINGS_VISUAL_PASSED' /tmp/godot-grid_settings_visual.log
          grep -q 'ATLAS_BRUSH_VISUAL_PASSED' /tmp/godot-brush_visual.log
          grep -q 'ATLAS_RASTER_RENDERING_PASSED' /tmp/godot-raster_rendering_visual.log
          grep -q 'ATLAS_DRAWING_PERFORMANCE_PASSED' /tmp/godot-drawing_performance_visual.log
          grep -q 'ATLAS_ERASER_VISUAL_PASSED' /tmp/godot-eraser_visual.log
          grep -q 'ATLAS_MOVE_VISUAL_PASSED' /tmp/godot-move_visual.log
          grep -q 'ATLAS_BUCKET_VISUAL_PASSED' /tmp/godot-bucket_visual.log
          grep -q 'ATLAS_LINE_VISUAL_PASSED' /tmp/godot-line_visual.log
          grep -q 'ATLAS_POLYGON_VISUAL_PASSED' /tmp/godot-polygon_visual.log
          grep -q 'ATLAS_WALL_PATHS_VISUAL_PASSED' /tmp/godot-wall_paths_visual.log
          grep -q 'ATLAS_TEXT_VISUAL_PASSED' /tmp/godot-text_visual.log
          grep -q 'ATLAS_PEN_TURNS_VISUAL_PASSED' /tmp/godot-pen_turns_visual.log
          grep -q 'ATLAS_PEN_WIDTH_WHEEL_VISUAL_PASSED' /tmp/godot-pen_width_wheel_visual.log
          grep -q 'ATLAS_SELECTION_INTERACTIONS_VISUAL_PASSED' /tmp/godot-selection_interactions_visual.log
          grep -q 'ATLAS_SNAPPING_VISUAL_PASSED' /tmp/godot-snapping_visual.log
          grep -q 'ATLAS_LAYER_HIERARCHY_VISUAL_PASSED' /tmp/godot-layer_hierarchy_visual.log
          grep -q 'ATLAS_PREVIEW_UI_PASSED' /tmp/godot-preview_ui_smoke.log
          grep -q 'ATLAS_LINKED_MAPS_UI_PASSED' /tmp/godot-linked_maps_ui_smoke.log
          grep -q 'ATLAS_REFERENCES_UI_PASSED' /tmp/godot-references_ui_smoke.log
          grep -q 'ATLAS_PLAYER_PROJECTION_VISUAL_PASSED' /tmp/godot-player_projection_visual.log
          grep -q 'ATLAS_PROJECTOR_FRAME_VISUAL_PASSED' /tmp/godot-projector_frame_visual.log
          grep -q 'ATLAS_PLAYER_OUTPUT_SESSION_VISUAL_PASSED' /tmp/godot-player_output_session_visual.log
          grep -q 'ATLAS_TOKEN_VISUAL_PASSED' /tmp/godot-token_visual.log
          grep -q 'ATLAS_FOG_VISUAL_PASSED' /tmp/godot-fog_visual.log
          grep -q 'ATLAS_PLAYER_PRIVACY_ACCEPTANCE_VISUAL_PASSED' /tmp/godot-player_privacy_acceptance_visual.log
          grep -q 'ATLAS_PLAYER_WEB_FALLBACK_VISUAL_PASSED' /tmp/godot-player_web_fallback_visual.log
          grep -q 'ATLAS_COLLABORATION_ACCEPTANCE_VISUAL_PASSED' /tmp/godot-collaboration_acceptance_visual.log
          ci_finish
      - name: Launch main scene headlessly
        id: ci_83_launch_main_scene_headlessly
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee /tmp/godot-launch.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:|Compile Error:' /tmp/godot-launch.log; then exit 1; fi
      - name: Export Web (single-thread, Compatibility)
        id: ci_84_export_web_single_thread_compatibility
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tee /tmp/godot-export.log
          test -s build/web/index.html
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:|Compile Error:' /tmp/godot-export.log; then exit 1; fi
      - name: Verify fresh-process saves across exported script remaps
        id: ci_85_verify_fresh_process_saves_across_exported_script_remaps
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: |
          source tools/ci_fail_late.sh
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/storage_smoke.gd -- write-portable /tmp/atlas-source.scn 2>&1 | tee /tmp/atlas-source-write.log
          timeout --signal=TERM --kill-after=5s 120s godot --headless --main-pack build/web/index.pck --script "$GITHUB_WORKSPACE/tests/storage_smoke.gd" -- read-portable /tmp/atlas-source.scn 2>&1 | tee /tmp/atlas-pack-read.log
          timeout --signal=TERM --kill-after=5s 120s godot --headless --main-pack build/web/index.pck --script "$GITHUB_WORKSPACE/tests/storage_smoke.gd" -- write-portable /tmp/atlas-packed.scn 2>&1 | tee /tmp/atlas-pack-write.log
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/storage_smoke.gd -- read-portable /tmp/atlas-packed.scn 2>&1 | tee /tmp/atlas-source-read.log
          for log in /tmp/atlas-source-write.log /tmp/atlas-pack-read.log /tmp/atlas-pack-write.log /tmp/atlas-source-read.log; do
            grep -q 'ATLAS_PORTABILITY_PASSED' "$log"
            if grep -E 'SCRIPT ERROR:|^ERROR:|FAILED:' "$log"; then ci_fail_marker 'Forbidden error marker'; fi
          done
          ci_finish
      - name: Upload Web build
        id: ci_86_upload_web_build
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: drawinatlas-web
          path: build/web/
      # Individual checks use continue-on-error so the entire matrix runs.
      # The original `outcome` (not the post-override `conclusion`) is decisive.
      - name: Summarize CI failures
        if: ${{ !cancelled() }}
        env:
          GODOT_CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 tools/report_godot_ci.py
