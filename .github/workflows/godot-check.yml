        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Verify T-055 native Atlas renderer, overlays and history
        id: ci_75_verify_t_055_native_atlas_renderer_overlays_and_history
        if: ${{ !cancelled() }}
