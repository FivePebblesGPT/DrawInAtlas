        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          python3 tools/build_drawing_app.py --in-place
          timeout --signal=TERM --kill-after=5s 240s xvfb-run -a godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path drawing --script res://tests/workspace_keyboard_smoke.gd 2>&1 | tee /tmp/t073-keyboard.log
          grep -q 'T073_KEYBOARD_PASSED' /tmp/t073-keyboard.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T073_KEYBOARD_FAILED:' /tmp/t073-keyboard.log; then exit 1; fi
