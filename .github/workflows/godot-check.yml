        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_t069_architecture_docs.py' -v
      - name: Verify T-070 world, authored-detail and navigation documentation
        id: ci_18_verify_t_070_world_authored_detail_and_navigation_documentation
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_t070_world_docs.py' -v
      - name: Verify T-071 sparse campaign persistence and recovery documentation
        id: ci_19_verify_t_071_sparse_campaign_persistence_and_recovery_documenta
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_t071_storage_docs.py' -v
      - name: Verify T-072 current tools versus historical workflow documentation
        id: ci_20_verify_t_072_current_tools_versus_historical_workflow_documenta
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_t072_tools_docs.py' -v
      - name: Verify T-073 approved inventory versus proposed workspace UX
        id: ci_21_verify_t_073_approved_inventory_versus_proposed_workspace_ux
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_t073_feature_ux_docs.py' -v
      - name: Verify T-063 compact Drawing workspace and shortcut contract
        id: ci_22_verify_t_063_compact_drawing_workspace_and_shortcut_contract
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_t063_workspace_docs.py' -v
      - name: Verify T-074 Object Asset authoring, NULL and staged nesting documentation
        id: ci_23_verify_t_074_object_asset_authoring_null_and_staged_nesting_doc
        if: ${{ !cancelled() }}
