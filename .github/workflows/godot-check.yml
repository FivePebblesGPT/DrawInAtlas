        run: |
          source tools/ci_fail_late.sh
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/campaign_bundle_smoke.gd 2>&1 | tee /tmp/godot-t066-bundle.log
          grep -q 'ATLAS_BUNDLE_PASSED' /tmp/godot-t066-bundle.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T066_FAILED:|ATLAS_BUNDLE_FAILED' /tmp/godot-t066-bundle.log; then ci_fail_marker 'Forbidden error marker'; fi
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/campaign_bundle_editor_smoke.gd 2>&1 | tee /tmp/godot-t066-editor.log
          grep -q 'ATLAS_BUNDLE_EDITOR_PASSED' /tmp/godot-t066-editor.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T066_EDITOR_FAILED:|ATLAS_BUNDLE_EDITOR_FAILED' /tmp/godot-t066-editor.log; then ci_fail_marker 'Forbidden error marker'; fi
          ci_finish
      - name: Verify T-067 measured chunk geometry and Zstd parity
        id: ci_16_verify_t_067_measured_chunk_geometry_and_zstd_parity
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          source tools/ci_fail_late.sh
          python3 -m unittest discover -s tests -p 'test_chunk_geometry.py' -v
          python3 tools/benchmarks/chunk_geometry.py --output /tmp/t067-ci --repeats 1 \
            2>&1 | tee /tmp/t067-layouts.log
          grep -q 'T067_GEOMETRY_PASSED (16 workload/stride cases, 48 layout cases)' /tmp/t067-layouts.log
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/chunk_geometry_codec_smoke.gd -- \
            --folder /tmp/t067-ci 2>&1 | tee /tmp/t067-codec.log
          grep -q 'T067_CODEC_PASSED' /tmp/t067-codec.log
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://tests/chunk_geometry_benchmark.gd -- \
            --output /tmp/t067-ci/native.json 2>&1 | tee /tmp/t067-native.log
          grep -q 'T067_NATIVE_PASSED (386 checks, 0 failures)' /tmp/t067-native.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T067_FAILED:|T067_CODEC_FAILED' \
            /tmp/t067-codec.log /tmp/t067-native.log; then ci_fail_marker 'Forbidden error marker'; fi
          ci_finish
      - name: Verify T-069 approved architecture and typed model documentation
        id: ci_17_verify_t_069_approved_architecture_and_typed_model_documentatio
        if: ${{ !cancelled() }}
        continue-on-error: true
