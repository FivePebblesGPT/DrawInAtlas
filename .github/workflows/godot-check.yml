        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          python3 tools/build_drawing_app.py --in-place
          godot --headless --editor --path drawing --import --quit
          xvfb-run -a godot --display-driver x11 --audio-driver Dummy \
            --rendering-method gl_compatibility --path drawing \
            --script res://tests/compact_workspace_smoke.gd 2>&1 | tee /tmp/t063-workspace.log
          grep -q 'T063_WORKSPACE_PASSED' /tmp/t063-workspace.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|T063_FAILED:' /tmp/t063-workspace.log; then exit 1; fi
      - name: Verify T-058 native framebuffer glyphs and explicit conversion
        id: ci_80_verify_t_058_native_framebuffer_glyphs_and_explicit_conversion
        if: ${{ !cancelled() }}
        continue-on-error: true
