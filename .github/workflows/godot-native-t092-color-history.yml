name: Godot T-092 compact Colors/History native witness (on demand)

on:
  workflow_dispatch:

jobs:
  color-history-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install pinned Godot 4.8 beta 2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta2
          use-dotnet: false
      - name: Install X11 software-rendered display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Stage and import canonical standalone Drawing package
        run: |
          set -euo pipefail
          python3 tools/build_drawing_app.py --in-place
          timeout --signal=TERM --kill-after=5s 240s godot --headless --editor --path drawing --import --quit
      - name: Verify swatch framebuffer, event cursor, native dock clicks and floating layout
        run: |
          set -euo pipefail
          mkdir -p /tmp/t092-screenshots
          T092_SCREENSHOTS=/tmp/t092-screenshots timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a --server-args='-screen 0 2200x1500x24' godot --display-driver x11 \
            --rendering-method gl_compatibility --audio-driver Dummy --path drawing \
            --script res://tests/color_history_native.gd 2>&1 | tee /tmp/t092-native.log
          python3 tools/check_native_t092_log.py /tmp/t092-native.log
      - name: Upload Xvfb-only framebuffer screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t092-xvfb-color-history
          path: |
            /tmp/t092-native.log
            /tmp/t092-screenshots/
          if-no-files-found: warn
