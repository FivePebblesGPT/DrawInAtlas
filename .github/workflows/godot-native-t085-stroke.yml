name: Godot T-085 held-button framebuffer (on demand, software only)

on:
  workflow_dispatch:

jobs:
  live-stroke-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install pinned Godot 4.8 beta 3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta4
          use-dotnet: false
      - name: Install pinned Rust 1.99.1 and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Install software-display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Build mandatory native Brush and import both Drawing/Atlas consumers
        run: |
          set -euo pipefail
          # A clean checkout has no tracked .so; neither consumer may import first.
          make build TOOLCHAIN=system
      - name: Verify queued live stroke and exact native history model
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --audio-driver Dummy \
            --path drawing --script res://tests/live_stroke_smoke.gd 2>&1 | tee /tmp/t085-model.log
          python3 tools/check_godot_model_log.py /tmp/t085-model.log --marker T085_MODEL_PASSED
      - name: Verify 100/50/25 percent held preview and nine 840-point native replays
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s xvfb-run -a --server-args='-screen 0 1600x1200x24' \
            godot --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy \
            --path drawing --script res://tests/live_stroke_native.gd 2>&1 | tee /tmp/t085-native.log
          python3 tools/check_native_t085_log.py /tmp/t085-native.log
      - name: Upload model and native software-only diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t085-native-software-framebuffer
          path: |
            /tmp/t085-model.log
            /tmp/t085-native.log
          if-no-files-found: warn
