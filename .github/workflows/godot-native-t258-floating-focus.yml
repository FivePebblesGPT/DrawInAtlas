name: Godot T-258 floating focus-loss gesture rollback (on demand)

on:
  workflow_dispatch:

jobs:
  floating-focus-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install pinned Godot 4.8 beta 3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta3
          use-dotnet: false
      - name: Install pinned Rust 1.99.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Install X11/Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Build native extension and import both consumers
        run: make build TOOLCHAIN=system
      - name: Test standalone floating focus-loss cancellation
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a --server-args='-screen 0 2200x1500x24' godot \
            --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy \
            --path drawing --script res://tests/t258_floating_focus_cancel_native.gd 2>&1 | tee /tmp/t258-native.log
          python3 tools/check_godot_model_log.py /tmp/t258-native.log --marker T258_NATIVE_PASSED
      - name: Test Atlas embedded floating focus-loss cancellation
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a --server-args='-screen 0 2200x1500x24' godot \
            --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy \
            --path . --script res://tests/t258_atlas_floating_focus_cancel_native.gd 2>&1 | tee /tmp/t258-atlas.log
          python3 tools/check_godot_model_log.py /tmp/t258-atlas.log --marker T258_ATLAS_PASSED
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t258-floating-focus-loss
          path: |
            /tmp/t258-native.log
            /tmp/t258-atlas.log
          if-no-files-found: warn
