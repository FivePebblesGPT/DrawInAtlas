name: Godot T-096 large contours and floating Move (on demand, software only)

on:
  workflow_dispatch:

jobs:
  large-selection-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install pinned Godot 4.8 beta 3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta4
          use-dotnet: false
      - name: Install pinned Rust 1.99.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Install Mesa software display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Compile required native Brush and import both Drawing and Atlas
        run: |
          set -euo pipefail
          make build TOOLCHAIN=system
      - name: Independent selection contour and Move byte oracle
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/selection_large_smoke.gd 2>&1 | tee /tmp/t096-model.log
          python3 tools/check_t096_logs.py model /tmp/t096-model.log
      - name: Pointer-delivered marquee and Move software framebuffer
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s xvfb-run -a -s '-screen 0 1280x900x24' \
            godot --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy \
            --path drawing --script res://tests/selection_large_native.gd \
            2>&1 | tee /tmp/t096-native.log
          python3 tools/check_t096_logs.py native /tmp/t096-native.log
      - name: Atlas signed large Move, global native history and campaign Save/Open
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s godot --headless --audio-driver Dummy --path . \
            --script res://tests/t268_atlas_large_move.gd \
            2>&1 | tee /tmp/t268-atlas.log
          python3 tools/check_t096_logs.py atlas /tmp/t268-atlas.log
      - name: Upload diagnostic logs (not physical/owner acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t096-contour-native-move-atlas
          path: |
            /tmp/t096-model.log
            /tmp/t096-native.log
            /tmp/t268-atlas.log
          if-no-files-found: warn
