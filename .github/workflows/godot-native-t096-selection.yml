name: Godot T-096 large contours and floating Move (on demand, software only)

on:
  workflow_dispatch:

jobs:
  large-selection-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install pinned Godot 4.8 beta 3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.8.0-beta3
          use-dotnet: false
      - name: Install Mesa software display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Stage canonical Drawing files and import resources
        run: |
          set -euo pipefail
          python3 tools/build_drawing_app.py --in-place
          timeout --signal=TERM --kill-after=5s 240s godot --headless --editor --path drawing --import --quit
      - name: Independent selection contour and move byte oracle
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s godot --headless --audio-driver Dummy --path drawing \
            --script res://tests/selection_large_smoke.gd 2>&1 | tee /tmp/t096-model.log
          python3 tools/check_godot_model_log.py /tmp/t096-model.log --marker T096_MODEL_PASSED
      - name: Pointer-delivered marquee and Move software framebuffer
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s xvfb-run -a -s '-screen 0 1280x900x24' \
            godot --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy \
            --path drawing --script res://tests/selection_large_native.gd \
            2>&1 | tee /tmp/t096-native.log
          python3 tools/check_godot_model_log.py /tmp/t096-native.log --marker T096_NATIVE_PASSED
      - name: Upload diagnostic logs (not physical/owner acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t096-contour-source-and-software-move
          path: |
            /tmp/t096-model.log
            /tmp/t096-native.log
          if-no-files-found: warn
