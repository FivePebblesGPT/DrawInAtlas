name: T-068 optional Skia CPU parity screen (on demand)

on:
  workflow_dispatch:

jobs:
  skia-cpu-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch and verify pinned CPU-only Skia wheel
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libegl1
          python3 -m pip download --no-deps --only-binary=:all: \
            --platform manylinux_2_28_x86_64 --python-version 3.13 \
            --implementation cp --abi cp313 -d /tmp 'skia-python==144.1'
          echo 'a008767c16671f3704ea5e1a8cee99854047044632c0d71a37105d6b632b816a  /tmp/skia_python-144.1-cp313-cp313-manylinux_2_28_x86_64.whl' | sha256sum -c -
          python3 -m pip install 'numpy==2.3.5' 'pybind11==3.0.1'
          python3 -m pip install --no-deps /tmp/skia_python-144.1-cp313-cp313-manylinux_2_28_x86_64.whl
      - name: Verify format loss, oracle and independent path coverage
        env:
          T068_SKIA_WHEEL: /tmp/skia_python-144.1-cp313-cp313-manylinux_2_28_x86_64.whl
        run: |
          python3 -m unittest discover -s tests -p test_t068_skia_cpu.py -v
          python3 -m unittest discover -s tests -p test_t068_skia_brush.py -v
      - name: Record two runs against checked C++ and exact RGBA8
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/benchmarks/t068_skia_cpu.py \
            --wheel /tmp/skia_python-144.1-cp313-cp313-manylinux_2_28_x86_64.whl \
            --runs 2 --trials 9 --sides 32 64 128 \
            --output /tmp/t068-skia-cpu.json | tee /tmp/t068-skia-cpu.log
          grep -q 'T068_SKIA_CPU_PASSED: 126 verified rectangle cases across 2 runs;' /tmp/t068-skia-cpu.log
          test -s /tmp/t068-skia-cpu.json
      - name: Compare Skia hard brush and selections to pinned Godot oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/benchmarks/t068_skia_brush.py \
            --wheel /tmp/skia_python-144.1-cp313-cp313-manylinux_2_28_x86_64.whl \
            --runs 2 --trials 7 --output /tmp/t068-skia-brush.json \
            | tee /tmp/t068-skia-brush.log
          grep -q 'T068_SKIA_BRUSH_SCREEN_PASSED: 32 Godot brush/mask comparisons;' /tmp/t068-skia-brush.log
          test -s /tmp/t068-skia-brush.json
      - name: Upload Skia parity and timing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t068-skia-cpu-diagnostics
          path: |
            /tmp/t068-skia-cpu.json
            /tmp/t068-skia-cpu.log
            /tmp/t068-skia-brush.json
            /tmp/t068-skia-brush.log
          if-no-files-found: warn
